name: android

# BANDROID-018: the L0/L1 Android Rust gate. This expensive emulator workflow is
# manually dispatched only for a version tag; ordinary pushes and PRs never
# start Android SDK/NDK setup, Rust cross-compilation, Gradle, or an emulator.
#
# Scope: L0 = cargo check (aarch64 + x86_64), L1 = clippy -D warnings on
# aarch64. It builds all registered APK flavors and runs their JVM and Android
# Emulator suites on an isolated Gradle Managed Device.
#
# Note: Gradle's shared cargoBuild creates the Android Rust service library for
# both ABIs; Bevy and Slint flavor tasks build their native UI libraries too.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Android flavor to build and test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - compose
          - bevy
          - slint
      run_emulator:
        description: 'Run Gradle Managed Device emulator suite'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# 同一引用的新提交自动取消旧运行：过时结果尽早退出，不浪费算力。
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 中禁用增量编译：产物更小、缓存更省、全量构建更可复现。
  CARGO_INCREMENTAL: 0

jobs:
  android:
    name: Android Rust compile + Clippy gate
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    # 显式钉最新 LTS（ubuntu-26.04 已 GA），不跟 ubuntu-latest 的静默迁移走。
    runs-on: ubuntu-26.04
    # Compose、Bevy 与 Slint Gradle flavors 共用同一套 Android owner 和工具链。
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 托管 runner 根分区约 14 GB，Android SDK/NDK + 模拟器 + 双 ABI cargo 构建装不下；
      # 先回收本 job 用不到的重型工具链，但保留 Android SDK（见 scripts/ci-free-disk.sh）。
      - name: Free runner disk space
        shell: bash
        run: bash scripts/ci-free-disk.sh --keep-android

      - name: Resolve pinned Android toolchain
        id: android-toolchain
        run: python3 scripts/android-toolchain.py github-output "$GITHUB_OUTPUT"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: ${{ steps.android-toolchain.outputs.java_distribution }}
          java-version: ${{ steps.android-toolchain.outputs.java_major }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ steps.android-toolchain.outputs.android_cmdline_tools_revision }}

      # setup-android installs the pinned build under `cmdline-tools/<version>`
      # but leaves a preinstalled `latest` symlink pointing at the image's newer
      # tools. Repoint `latest` so every sdkmanager call and the toolchain check
      # use the registered version.
      - name: Pin Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/cmdline-tools/${{ steps.android-toolchain.outputs.android_cmdline_tools_version }}"
          test -d "$TOOLS"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          ln -s "$TOOLS" "$ANDROID_HOME/cmdline-tools/latest"
          cat "$ANDROID_HOME/cmdline-tools/latest/source.properties"

      # Pin the SDK packages used by APK builds and the Gradle Managed Device.
      - name: Install Android platform, emulator, and system image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PACKAGES=(
            "platform-tools"
            "platforms;android-${{ steps.android-toolchain.outputs.android_sdk_platform }}"
            "build-tools;${{ steps.android-toolchain.outputs.android_build_tools }}"
          )
          if [ "${{ inputs.run_emulator }}" != "false" ]; then
            PACKAGES+=("emulator" "system-images;android-${{ steps.android-toolchain.outputs.android_emulator_api }};${{ steps.android-toolchain.outputs.android_emulator_image }}")
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "${PACKAGES[@]}"
          rc=$?
          set -o pipefail
          [ "$rc" -eq 0 ] || { echo "::error::sdkmanager failed to install packages (rc=$rc)"; exit "$rc"; }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-gate

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="${{ steps.android-toolchain.outputs.android_ndk_version }}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # nttld/setup-ndk builds `android-ndk-<version>-linux.zip` from the
          # numeric version, which 404s for the r29 series. The SDK manager
          # knows the canonical `ndk;<version>` package and installs to
          # $ANDROID_HOME/ndk/<version> — exactly where gradle's `ndkVersion`
          # and the Bevy build look. `yes |` dies with SIGPIPE once sdkmanager
          # stops reading; neutralize pipefail for the pipeline only.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION"
          rc=$?
          set -o pipefail
          [ "$rc" -eq 0 ] || { echo "::error::sdkmanager failed to install ndk;$NDK_VERSION (rc=$rc)"; exit "$rc"; }
          NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK_ROOT"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Android Rust compile + Clippy gate
        shell: bash
        run: bash scripts/android-check.sh

      # Gradle creates, runs and tears down its temporary emulator. One task graph
      # builds every registered flavor, runs JVM tests and executes device suites.
      - name: Build and test every Android flavor in an isolated emulator
        shell: bash
        env:
          ANDROID_FLAVORS: ${{ inputs.flavor || 'all' }}
          ANDROID_RUN_EMULATOR: ${{ inputs.run_emulator != false }}
        run: bash scripts/android-emulator-tests.sh

      - name: Upload Android Emulator reports and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-test-evidence
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/tests/**
            android/app/build/outputs/apk/**
            android/app/build/outputs/androidTest-apk/**
            target/android-emulator-evidence/**
          if-no-files-found: warn
