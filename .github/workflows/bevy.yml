name: bevy

# Bevy 统一 surface CI gate：验证 bevy 版本锁定、bsn 守卫、测试与 lint。
# 现已纳入主 workspace，不再是独立工作区。
on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".config/nextest.toml"
      - ".github/workflows/bevy.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/infiltrator-bevy-ui/**"
      - "crates/infiltrator-bevy-widgets/**"
      - "rust-toolchain.toml"
      - "scripts/quality/bevy_bsn_guard.py"
      - "scripts/test-bevy.sh"
  pull_request:
    paths:
      - ".config/nextest.toml"
      - ".github/workflows/bevy.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/infiltrator-bevy-ui/**"
      - "crates/infiltrator-bevy-widgets/**"
      - "rust-toolchain.toml"
      - "scripts/quality/bevy_bsn_guard.py"
      - "scripts/test-bevy.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bevy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  bevy:
    name: Bevy unified surface
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup stable Rust with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Bevy version pin
        shell: bash
        run: |
          set -euo pipefail

          # Bevy crates must be workspace members
          for crate in infiltrator-bevy-widgets infiltrator-bevy-ui; do
            if ! grep -Fq "\"crates/$crate\"" Cargo.toml; then
              echo "::error::$crate must be a workspace member"
              exit 1
            fi
          done

          # Bevy must be pinned to exact version in workspace deps
          if ! grep -Fq 'bevy = { version = "=0.19.1"' Cargo.toml; then
            echo "::error::Bevy must be pinned to =0.19.1 in workspace dependencies"
            exit 1
          fi

          # naga 27 coexistence workaround must be present in infiltrator-iced
          if ! grep -Fq 'naga27' crates/infiltrator-iced/Cargo.toml; then
            echo "::error::naga27 coexistence workaround missing from infiltrator-iced"
            exit 1
          fi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@latest

      - name: Run Bevy validation
        shell: bash
        run: bash scripts/test-bevy.sh
