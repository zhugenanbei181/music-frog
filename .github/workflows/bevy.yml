name: bevy

# Bevy 同权产品 gate：结构规则、双端动态证据、Bevy 测试与 lint。
# 仅允许手动从版本 tag 运行，避免普通提交启动完整图形栈和编译任务。
#
# 结构守卫的唯一注册入口是 scripts/quality/check-structure.sh，
# 本工作流不复制任何内联守卫步骤：先以 --guards-only 在安装缓存/依赖前
# 秒级失败，最后由完整脚本再统一执行一遍守卫。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bevy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  bevy:
    name: Bevy unified surface
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    # 显式钉最新 LTS（ubuntu-26.04 已 GA），不跟 ubuntu-latest 的静默迁移走。
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 托管 runner 根分区约 14 GB，恢复缓存 + 编译 bevy 图形栈会写爆磁盘；先回收
      # 本 job 用不到的重型工具链（见 scripts/ci-free-disk.sh）。
      - name: Free runner disk space
        shell: bash
        run: bash scripts/ci-free-disk.sh

      # Bevy workspace membership, the exact `bevy` version pin and the naga
      # coexistence workaround are structural invariants enforced by
      # scripts/quality/workspace-pin-guard.py (via `test-bevy.sh
      # --guards-only` below). This workflow keeps no inline literal copies.

      # 守卫脚本需要 Python 3.11+ 的 tomllib；显式钉版本，不赌 runner 镜像默认值。
      - name: Setup Python for quality guards
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies for parity guards
        shell: bash
        run: python3 -m pip install Pillow

      - name: Enforce quality guards (fail fast)
        shell: bash
        run: bash scripts/test-bevy.sh --guards-only

      - name: Setup 1.99.0 Rust with fmt and clippy
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@latest

      - name: Run Bevy validation
        shell: bash
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:${{ env.PKG_CONFIG_PATH }}
        run: bash scripts/test-bevy.sh
