name: bevy

# Bevy 统一 surface CI gate：验证 bevy 版本锁定、bsn 守卫、测试与 lint。
# 现已纳入主 workspace，不再是独立工作区。
#
# 质量守卫的唯一权威清单在 scripts/test-bevy.sh（与 scripts/test.sh 同源），
# 本工作流不复制任何内联守卫步骤：先以 --guards-only 在安装缓存/依赖前
# 秒级失败，最后由完整脚本再统一执行一遍守卫。
