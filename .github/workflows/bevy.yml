permissions:
  contents: read

concurrency:
  group: bevy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  bevy:
    name: Bevy unified surface
    # 显式钉最新 LTS（ubuntu-26.04 已 GA），不跟 ubuntu-latest 的静默迁移走。
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Bevy version pin
        shell: bash
        run: |
          set -euo pipefail

          # Bevy crates must be workspace members
          for crate in infiltrator-bevy-widgets infiltrator-bevy-ui; do
            if ! grep -Fq "\"crates/$crate\"" Cargo.toml; then
              echo "::error::$crate must be a workspace member"
              exit 1
            fi
          done

          # Bevy must be pinned to exact version in workspace deps
          if ! grep -Fq 'bevy = { version = "=0.19.1"' Cargo.toml; then
            echo "::error::Bevy must be pinned to =0.19.1 in workspace dependencies"
            exit 1
          fi

          # naga 27 coexistence workaround must be present in infiltrator-iced
          if ! grep -Fq 'naga27' crates/infiltrator-iced/Cargo.toml; then
            echo "::error::naga27 coexistence workaround missing from infiltrator-iced"
            exit 1
          fi

      # 守卫脚本需要 Python 3.11+ 的 tomllib；显式钉版本，不赌 runner 镜像默认值。
      - name: Setup Python for quality guards
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Enforce quality guards (fail fast)
        shell: bash
        run: bash scripts/test-bevy.sh --guards-only

      - name: Setup stable Rust with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@latest

      - name: Run Bevy validation
        shell: bash
        run: bash scripts/test-bevy.sh
