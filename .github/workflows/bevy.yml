      - "rust-toolchain.toml"
      - "scripts/quality/bevy_bsn_guard.py"
      - "scripts/quality/core-boundary-guard.py"
      - "scripts/quality/parity-guard.py"
      - "scripts/quality/session-guard.py"
      - "scripts/quality/hot-reload-guard.py"
      - "scripts/quality/crash-watchdog-guard.py"
      - "scripts/quality/core-channel-guard.py"
      - "scripts/quality/kernel-integrity-guard.py"
      - "scripts/quality/kernel-rollback-guard.py"
      - "scripts/quality/controller-auth-guard.py"
