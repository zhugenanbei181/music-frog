name: bevy

# Bevy 同权产品 CI gate：结构规则、双端动态证据、Bevy 测试与 lint。
# 现已纳入主 workspace，不再是独立工作区。
#
# 结构守卫的唯一注册入口是 scripts/quality/check-structure.sh，
# 本工作流不复制任何内联守卫步骤：先以 --guards-only 在安装缓存/依赖前
# 秒级失败，最后由完整脚本再统一执行一遍守卫。
on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".config/nextest.toml"
      - ".github/workflows/bevy.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
      - "scripts/test-bevy.sh"
      - "scripts/test.sh"
      - "scripts/check-test-policy.sh"
      - "scripts/quality/**"
      - "scripts/parity/**"
      - "docs/CODE_QUALITY_BASELINE.md"
      - "docs/UI_PARITY_AUDIT.md"
  pull_request:
    paths:
      - ".config/nextest.toml"
      - ".github/workflows/bevy.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
      - "scripts/test-bevy.sh"
      - "scripts/test.sh"
      - "scripts/check-test-policy.sh"
      - "scripts/quality/**"
      - "scripts/parity/**"
      - "docs/CODE_QUALITY_BASELINE.md"
      - "docs/UI_PARITY_AUDIT.md"

permissions:
  contents: read

concurrency:
  group: bevy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  bevy:
    name: Bevy unified surface
    # 显式钉最新 LTS（ubuntu-26.04 已 GA），不跟 ubuntu-latest 的静默迁移走。
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Bevy version pin
        shell: bash
        run: |
          set -euo pipefail

          # Bevy crates must be workspace members
          for crate in infiltrator-bevy-widgets infiltrator-bevy-ui; do
            if ! grep -Fq "\"crates/$crate\"" Cargo.toml; then
              echo "::error::$crate must be a workspace member"
              exit 1
            fi
          done

          # Bevy must be pinned to exact version in workspace deps
          if ! grep -Fq 'bevy = { version = "=0.20.0-rc.2"' Cargo.toml; then
            echo "::error::Bevy must be pinned to =0.20.0-rc.2 in workspace dependencies"
            exit 1
          fi

          # naga 27 coexistence workaround must be present in infiltrator-iced
          if ! grep -Fq 'naga27' crates/infiltrator-iced/Cargo.toml; then
            echo "::error::naga27 coexistence workaround missing from infiltrator-iced"
            exit 1
          fi

      # 守卫脚本需要 Python 3.11+ 的 tomllib；显式钉版本，不赌 runner 镜像默认值。
      - name: Setup Python for quality guards
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies for parity guards
        shell: bash
        run: python3 -m pip install Pillow

      - name: Enforce quality guards (fail fast)
        shell: bash
        run: bash scripts/test-bevy.sh --guards-only

      - name: Setup 1.99.0 Rust with fmt and clippy
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@latest

      - name: Run Bevy validation
        shell: bash
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:${{ env.PKG_CONFIG_PATH }}
        run: bash scripts/test-bevy.sh
