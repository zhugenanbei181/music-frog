      - "scripts/quality/lan-sharing-guard.py"
      - "scripts/quality/lan-security-guard.py"
      - "scripts/quality/ipv6-routing-guard.py"
      - "scripts/quality/uwp-loopback-guard.py"
      - "scripts/quality/pac-service-guard.py"
      - "scripts/quality/network-roaming-guard.py"
      - "scripts/quality/vpn-service-guard.py"
      - "scripts/quality/system-toggle-guard.py"
      - "scripts/quality/privileged-network-guard.py"
      - "scripts/quality/traffic-waveform-guard.py"
      - "scripts/quality/traffic-scale-guard.py"
      - "scripts/quality/traffic-topology-guard.py"
      - "scripts/quality/traffic-topology-navigation-guard.py"
      - "scripts/quality/active-exit-guard.py"
      - "scripts/quality/subscription-quota-guard.py"
      - "scripts/quality/overview-master-switch-guard.py"
      - "scripts/quality/proxy-mode-segment-guard.py"
      - "scripts/quality/overview-speedtest-guard.py"
      - "scripts/quality/overview-metrics-grid-guard.py"
      - "scripts/quality/overview-ip-probe-guard.py"
      - "scripts/quality/overview-card-reorder-guard.py"
      - "scripts/quality/overview-reconnect-mask-guard.py"
      - "scripts/quality/overview-responsive-viewport-guard.py"
      - "scripts/quality/overview-regression-matrix-guard.py"
      - "scripts/quality/overview-card-reorder-guard.py"
      - "scripts/quality/proxies-five-group-guard.py"
      - "scripts/quality/proxies-group-collapse-guard.py"
      - "scripts/test-bevy.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bevy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  bevy:
    name: Bevy unified surface
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup stable Rust with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Bevy version pin
        shell: bash
        run: |
          set -euo pipefail

          # Bevy crates must be workspace members
          for crate in infiltrator-bevy-widgets infiltrator-bevy-ui; do
            if ! grep -Fq "\"crates/$crate\"" Cargo.toml; then
              echo "::error::$crate must be a workspace member"
              exit 1
            fi
          done

          # Bevy must be pinned to exact version in workspace deps
          if ! grep -Fq 'bevy = { version = "=0.19.1"' Cargo.toml; then
            echo "::error::Bevy must be pinned to =0.19.1 in workspace dependencies"
            exit 1
          fi

          # naga 27 coexistence workaround must be present in infiltrator-iced
          if ! grep -Fq 'naga27' crates/infiltrator-iced/Cargo.toml; then
            echo "::error::naga27 coexistence workaround missing from infiltrator-iced"
            exit 1
          fi

      - name: Enforce 0.30 core boundaries
        run: python3 scripts/quality/core-boundary-guard.py --mode enforce

      - name: Enforce dual-surface parity
        run: python3 scripts/quality/parity-guard.py --mode enforce

      - name: Enforce DUAL-01-01 session semantics
        run: python3 scripts/quality/session-guard.py --mode enforce

      - name: Enforce DUAL-01-02 hot reload semantics
        run: python3 scripts/quality/hot-reload-guard.py --mode enforce

      - name: Enforce DUAL-01-03 crash watchdog semantics
        run: python3 scripts/quality/crash-watchdog-guard.py --mode enforce

      - name: Enforce DUAL-01-04 core channel semantics
        run: python3 scripts/quality/core-channel-guard.py --mode enforce

      - name: Enforce DUAL-01-05 kernel integrity semantics
        run: python3 scripts/quality/kernel-integrity-guard.py --mode enforce

      - name: Enforce DUAL-01-06 kernel rollback semantics
        run: python3 scripts/quality/kernel-rollback-guard.py --mode enforce

      - name: Enforce DUAL-01-07 controller auth semantics
        run: python3 scripts/quality/controller-auth-guard.py --mode enforce

      - name: Enforce DUAL-01-08 live core log-level semantics
        run: python3 scripts/quality/core-log-level-guard.py --mode enforce

      - name: Enforce DUAL-01-09 service-mode semantics
        run: python3 scripts/quality/service-mode-guard.py --mode enforce

      - name: Enforce DUAL-01-10 process-exit cleanup semantics
        run: python3 scripts/quality/process-exit-guard.py --mode enforce

      - name: Enforce DUAL-01-11 port-conflict semantics
        run: python3 scripts/quality/port-conflict-guard.py --mode enforce

      - name: Enforce DUAL-01-12 core resource quota semantics
        run: python3 scripts/quality/core-resource-guard.py --mode enforce

      - name: Enforce DUAL-01-13 offline-first startup semantics
        run: python3 scripts/quality/offline-startup-guard.py --mode enforce

      - name: Enforce DUAL-01-14 lifecycle synchronization semantics
        run: python3 scripts/quality/lifecycle-sync-guard.py --mode enforce

      - name: Enforce DUAL-01-15 lifecycle matrix semantics
        run: python3 scripts/quality/lifecycle-matrix-guard.py --mode enforce

      - name: Enforce DUAL-02-01 TUN stack semantics
        run: python3 scripts/quality/tun-stack-guard.py --mode enforce

      - name: Enforce DUAL-02-02 adaptive MTU semantics
        run: python3 scripts/quality/mtu-negotiation-guard.py --mode enforce

      - name: Enforce DUAL-02-03 strict-route semantics
        run: python3 scripts/quality/tun-routing-guard.py --mode enforce

      - name: Enforce DUAL-02-04 system proxy semantics
        run: python3 scripts/quality/system-proxy-guard.py --mode enforce

      - name: Enforce DUAL-02-05 system proxy watchdog semantics
        run: python3 scripts/quality/system-proxy-watchdog-guard.py --mode enforce

      - name: Enforce DUAL-02-06 system proxy recovery semantics
        run: python3 scripts/quality/system-proxy-recovery-guard.py --mode enforce

      - name: Enforce DUAL-02-07 LAN sharing semantics
        run: python3 scripts/quality/lan-sharing-guard.py --mode enforce

      - name: Enforce DUAL-02-08 LAN security semantics
        run: python3 scripts/quality/lan-security-guard.py --mode enforce

      - name: Enforce DUAL-02-09 IPv6 routing semantics
        run: python3 scripts/quality/ipv6-routing-guard.py --mode enforce

      - name: Enforce DUAL-02-10 UWP loopback semantics
        run: python3 scripts/quality/uwp-loopback-guard.py --mode enforce

      - name: Enforce DUAL-02-11 PAC service semantics
        run: python3 scripts/quality/pac-service-guard.py --mode enforce

      - name: Enforce DUAL-02-12 network roaming semantics
        run: python3 scripts/quality/network-roaming-guard.py --mode enforce

      - name: Enforce DUAL-02-13 Android VpnService semantics
        run: python3 scripts/quality/vpn-service-guard.py --mode enforce

      - name: Enforce DUAL-02-14 system toggle parity
        run: python3 scripts/quality/system-toggle-guard.py --mode enforce

      - name: Enforce DUAL-02-15 privileged network regression
        run: python3 scripts/quality/privileged-network-guard.py --mode enforce

      - name: Enforce DUAL-03-01 traffic waveform parity
        run: python3 scripts/quality/traffic-waveform-guard.py --mode enforce

      - name: Enforce DUAL-03-02 traffic scale parity
        run: python3 scripts/quality/traffic-scale-guard.py --mode enforce

      - name: Enforce DUAL-03-03 traffic topology parity
        run: python3 scripts/quality/traffic-topology-guard.py --mode enforce

      - name: Enforce DUAL-03-04 topology drill-down navigation parity
        run: python3 scripts/quality/traffic-topology-navigation-guard.py --mode enforce

      - name: Enforce DUAL-03-05 active exit card parity
        run: python3 scripts/quality/active-exit-guard.py --mode enforce

      - name: Enforce DUAL-03-06 subscription quota parity
        run: python3 scripts/quality/subscription-quota-guard.py --mode enforce

      - name: Enforce DUAL-03-07 Overview master switch parity
        run: python3 scripts/quality/overview-master-switch-guard.py --mode enforce

      - name: Enforce DUAL-03-08 Overview proxy mode segment parity
        run: python3 scripts/quality/proxy-mode-segment-guard.py --mode enforce

      - name: Enforce DUAL-03-09 Overview speedtest button parity
        run: python3 scripts/quality/overview-speedtest-guard.py --mode enforce

      - name: Enforce DUAL-03-10 Overview metrics grid parity
        run: python3 scripts/quality/overview-metrics-grid-guard.py --mode enforce
      - name: Run Overview Public IP Probe Guard
        run: python3 scripts/quality/overview-ip-probe-guard.py --mode enforce
      - name: Run Overview Card Reorder Guard
        run: python3 scripts/quality/overview-card-reorder-guard.py --mode enforce
      - name: Run Overview Reconnect Mask Guard
        run: python3 scripts/quality/overview-reconnect-mask-guard.py --mode enforce
      - name: Run Overview Responsive Viewport Guard
        run: python3 scripts/quality/overview-responsive-viewport-guard.py --mode enforce
      - name: Run Overview Regression Matrix Guard
        run: python3 scripts/quality/overview-regression-matrix-guard.py --mode enforce
      - name: Run Proxies Five Group Guard
        run: python3 scripts/quality/proxies-five-group-guard.py --mode enforce
      - name: Run Proxies Group Collapse Guard
        run: python3 scripts/quality/proxies-group-collapse-guard.py --mode enforce

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@latest

      - name: Run Bevy validation
        shell: bash
        run: bash scripts/test-bevy.sh
