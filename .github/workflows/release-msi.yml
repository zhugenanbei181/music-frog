name: release-msi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 同 tag 重复构建时取消旧任务。
concurrency:
  group: release-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 1. 必须先装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 2. 再装 Node，并开启 pnpm 依赖缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # 3. Rust 环境保持不变
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 4. 直接安装依赖（setup-node 已处理缓存）
      - name: Install dependencies
        shell: bash
        run: pnpm install

      - name: Build config-manager UI
        shell: bash
        run: |
          pnpm --dir webui/config-manager-ui install
          pnpm --dir webui/config-manager-ui build

      # vendor/mihomo.exe 不再入库，打包前从官方 Release 拉取
      - name: Fetch mihomo core into vendor/
        shell: bash
        run: bash scripts/fetch-mihomo.sh

      - name: Build MSI
        shell: bash
        env:
          TAURI_BUNDLER: msi
        run: pnpm build

      # 5. 上传 Release（gh CLI 在 windows-latest 是预装的，无需安装检查）
      - name: Upload MSI to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          msi="$(find target/release/bundle/msi -name '*.msi' -print -quit)"
          if [ -z "$msi" ]; then
            echo "MSI not found in target/release/bundle/msi" >&2
            exit 1
          fi

          echo "Found MSI: $msi"

          # 检查 Release 是否存在，不存在则创建，存在则上传
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$msi" --clobber
          else
            gh release create "$tag" "$msi" --generate-notes
          fi
