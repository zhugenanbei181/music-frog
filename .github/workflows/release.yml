name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The release tag must pass the exact workspace test suite before any
  # platform build starts. This reusable call prevents a failing test run
  # from racing ahead of publication and avoids a second tag-triggered run.
  test-gate:
    name: Release test gate
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 1. Desktop Build Matrix (Windows, macOS, Linux)
  # ---------------------------------------------------------------------------
  build-desktop:
    needs: [test-gate]
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # 每条腿现在编译 iced + bevy 两个二进制（共享同一 target/cache）。iced-only
    # 时代的 45 分钟不够，超时会把整条腿已完成的编译全部浪费掉。
    timeout-minutes: 75
    strategy:
      # A failed platform must stop the release fan-out; publish-release is
      # gated on every matrix leg and partial releases are never useful.
      fail-fast: true
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: infiltrator-iced.exe
            bevy_binary_name: infiltrator-bevy-ui.exe
            pkg_format: nsis
            artifact_name: Infiltrator-Windows-x86_64
            bevy_artifact_name: Infiltrator-Bevy-Windows-x86_64
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: infiltrator-iced.exe
            bevy_binary_name: infiltrator-bevy-ui.exe
            pkg_format: zip
            artifact_name: Infiltrator-Windows-aarch64
            bevy_artifact_name: Infiltrator-Bevy-Windows-aarch64
          # macOS Apple Silicon (arm64)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: infiltrator-iced
            bevy_binary_name: infiltrator-bevy-ui
            pkg_format: dmg
            artifact_name: Infiltrator-macOS-arm64
            bevy_artifact_name: Infiltrator-Bevy-macOS-arm64
          # macOS Intel (x86_64)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary_name: infiltrator-iced
            bevy_binary_name: infiltrator-bevy-ui
            pkg_format: dmg
            artifact_name: Infiltrator-macOS-x86_64
            bevy_artifact_name: Infiltrator-Bevy-macOS-x86_64
          # Linux x64 —— cargo-zigbuild 把 glibc 下限定桩在 2.17（CentOS 7 /
          # Debian 9 级别），产物兼容性不随构建机系统漂移，runner 始终跟最新
          # LTS；OpenSSL 经 static-openssl feature 静态内联，产物不依赖用户机
          # libssl（deb control 的 Depends 已同步）。iced 与 bevy 共用同一
          # runner/cache，各自出独立安装包（一碗水端平）。
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            tool: zigbuild
            binary_name: infiltrator-iced
            bevy_binary_name: infiltrator-bevy-ui
            pkg_format: linux-all
            artifact_name: Infiltrator-Linux-x86_64
            bevy_artifact_name: Infiltrator-Bevy-Linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore verified platform kernel
        shell: bash
        run: bash scripts/fetch-mihomo.sh --target ${{ matrix.target }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release

      - name: Install cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Setup zig
        if: matrix.tool == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          # 与本地验证过的构建保持同一 zig 版本（GLIBC 2.17 定桩已实测）。
          version: 0.14.1

      - name: Install NSIS
        if: runner.os == 'Windows' && matrix.pkg_format == 'nsis'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            file \
            dpkg-dev

      # zigbuild 对 .2.17 定桩目标会把产物写进 base triple 的目录
      # （target/x86_64-unknown-linux-gnu/release，已实测），与普通构建一致。
      - name: Build Release Binary (zig-pinned glibc floor)
        if: matrix.tool == 'zigbuild'
        run: >
          cargo zigbuild --release --target ${{ matrix.zig_target }}
          -p infiltrator-iced --features static-openssl --bin infiltrator-iced

      - name: Build Release Binary
        if: matrix.tool != 'zigbuild'
        run: cargo build --release --target ${{ matrix.target }} --bin infiltrator-iced

      # -----------------------------------------------------------------------
      # Bevy unified surface: identical platform matrix, its own binary and
      # its own equal package set. Shares this leg's toolchain/cache.
      # -----------------------------------------------------------------------
      - name: Build Bevy Release Binary (zig-pinned glibc floor)
        if: matrix.tool == 'zigbuild'
        run: >
          cargo zigbuild --release --target ${{ matrix.zig_target }}
          -p infiltrator-bevy-ui --features static-openssl --bin infiltrator-bevy-ui

      - name: Build Bevy Release Binary
        if: matrix.tool != 'zigbuild'
        run: cargo build --release --target ${{ matrix.target }} --bin infiltrator-bevy-ui

      - name: Package Windows Artifacts (NSIS & ZIP)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/infiltrator-iced.exe"
          test -s "$BIN_PATH"

          ZIP_NAME="${{ matrix.artifact_name }}.zip"
          PACKAGE_DIR="dist/windows-iced"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/infiltrator-iced.exe"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo.exe"
          (cd "$PACKAGE_DIR" && 7z a -tzip "../${ZIP_NAME}" .)
          test -s "dist/${ZIP_NAME}"

          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            bash packaging/windows/nsis/build-nsis.sh iced "${GITHUB_REF_NAME#v}" \
              "$BIN_PATH" "dist/Infiltrator-Setup-x86_64.exe"
            test -s "dist/Infiltrator-Setup-x86_64.exe"
          fi

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Package Bevy Windows Artifacts (NSIS & ZIP)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bevy_binary_name }}"
          test -s "$BIN_PATH"

          ZIP_NAME="${{ matrix.bevy_artifact_name }}.zip"
          PACKAGE_DIR="dist/windows-bevy"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/infiltrator-bevy-ui.exe"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo.exe"
          (cd "$PACKAGE_DIR" && 7z a -tzip "../${ZIP_NAME}" .)
          test -s "dist/${ZIP_NAME}"

          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            bash packaging/windows/nsis/build-nsis.sh bevy "${GITHUB_REF_NAME#v}" \
              "$BIN_PATH" "dist/Infiltrator-Bevy-Setup-x86_64.exe"
            test -s "dist/Infiltrator-Bevy-Setup-x86_64.exe"
          fi

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Package macOS Artifacts (DMG & Tarball)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/infiltrator-iced"
          test -s "$BIN_PATH"
          chmod +x "$BIN_PATH"

          APP_DIR="dist/Infiltrator.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "$BIN_PATH" "$APP_DIR/Contents/MacOS/infiltrator-iced"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$APP_DIR/Contents/Resources/mihomo"
          cp packaging/macos/Info.plist "$APP_DIR/Contents/Info.plist"

          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C dist Infiltrator.app
          test -s "dist/${{ matrix.artifact_name }}.tar.gz"
          bash packaging/macos/create-dmg.sh "dist/${{ matrix.artifact_name }}.dmg" "$APP_DIR"
          test -s "dist/${{ matrix.artifact_name }}.dmg"

      - name: Package Bevy macOS Artifacts (DMG & Tarball)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bevy_binary_name }}"
          test -s "$BIN_PATH"
          chmod +x "$BIN_PATH"

          APP_DIR="dist/InfiltratorBevy.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "$BIN_PATH" "$APP_DIR/Contents/MacOS/${{ matrix.bevy_binary_name }}"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$APP_DIR/Contents/Resources/mihomo"
          sed -e 's/infiltrator-iced/infiltrator-bevy-ui/' \
              -e 's/app\.musicfrog\.infiltrator/app.musicfrog.infiltrator.bevy/' \
              -e 's#<string>Infiltrator</string>#<string>Infiltrator Bevy</string>#g' \
              packaging/macos/Info.plist > "$APP_DIR/Contents/Info.plist"

          tar -czf "dist/${{ matrix.bevy_artifact_name }}.tar.gz" -C dist InfiltratorBevy.app
          test -s "dist/${{ matrix.bevy_artifact_name }}.tar.gz"
          VOL_NAME="Infiltrator Bevy" bash packaging/macos/create-dmg.sh \
            "dist/${{ matrix.bevy_artifact_name }}.dmg" "$APP_DIR"
          test -s "dist/${{ matrix.bevy_artifact_name }}.dmg"

      - name: Package Linux Artifacts (AppImage, Deb & Tarball)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/infiltrator-iced"
          test -s "$BIN_PATH"
          chmod +x "$BIN_PATH"

          PACKAGE_DIR="dist/linux-iced"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/infiltrator-iced"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo"
          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C "$PACKAGE_DIR" .
          test -s "dist/${{ matrix.artifact_name }}.tar.gz"

          bash packaging/linux/deb/build-deb.sh "$BIN_PATH" \
            "${GITHUB_REF_NAME#v}" "amd64" "dist"
          test -s "dist/infiltrator_${GITHUB_REF_NAME#v}_amd64.deb"

          bash packaging/linux/appimage/build-appimage.sh "$BIN_PATH" \
            "dist/Infiltrator-Linux-x86_64.AppImage"
          test -s "dist/Infiltrator-Linux-x86_64.AppImage"

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Package Bevy Linux Artifacts (AppImage, Deb & Tarball)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bevy_binary_name }}"
          test -s "$BIN_PATH"
          chmod +x "$BIN_PATH"

          PACKAGE_DIR="dist/linux-bevy"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/${{ matrix.bevy_binary_name }}"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo"
          tar -czf "dist/${{ matrix.bevy_artifact_name }}.tar.gz" -C "$PACKAGE_DIR" .
          test -s "dist/${{ matrix.bevy_artifact_name }}.tar.gz"

          APP_BIN=infiltrator-bevy-ui \
          APP_PKG=infiltrator-bevy \
          APP_DISPLAY_NAME="Infiltrator Bevy" \
          APP_DESKTOP=packaging/linux/appimage/infiltrator-bevy.desktop \
          APP_ICON=crates/infiltrator-iced/icons/icon.png \
            bash packaging/linux/deb/build-deb.sh "$BIN_PATH" \
              "${GITHUB_REF_NAME#v}" "amd64" "dist"
          test -s "dist/infiltrator-bevy_${GITHUB_REF_NAME#v}_amd64.deb"

          APP_BIN=infiltrator-bevy-ui \
          APP_PKG=infiltrator-bevy \
          APP_DESKTOP=packaging/linux/appimage/infiltrator-bevy.desktop \
          APP_ICON=crates/infiltrator-iced/icons/icon.png \
            bash packaging/linux/appimage/build-appimage.sh "$BIN_PATH" \
              "dist/${{ matrix.bevy_artifact_name }}.AppImage"
          test -s "dist/${{ matrix.bevy_artifact_name }}.AppImage"

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  # ---------------------------------------------------------------------------
  # 2. Android APK Build Job (iced + bevy share ONE SDK/NDK/JDK)
  # ---------------------------------------------------------------------------
  build-android:
    needs: [test-gate]
    name: Build Android APKs (iced + bevy)
    # 显式钉最新 LTS（ubuntu-26.04 已 GA），不跟 ubuntu-latest 的静默迁移走。
    runs-on: ubuntu-26.04
    # iced(gradle) 与 bevy(cargo-apk) 串行跑在同一 runner，共享一套工具链；
    # 相比两个作业各自装链，省下一次 SDK/NDK/JDK 供给与一份 ~1.2GB 缓存。
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # BANDROID-024: the Compose host compiles against API 37 (latest stable
      # AndroidX/Compose). Install the platform and build-tools explicitly.
      - name: Install Android platform 37 and build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;37.0.0"
          rc=$?
          set -o pipefail
          [ "$rc" -eq 0 ] || { echo "::error::sdkmanager failed to install platform 37 (rc=$rc)"; exit "$rc"; }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="29.0.14206865"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # nttld/setup-ndk builds `android-ndk-<version>-linux.zip` from the
          # numeric version, which 404s for the r29 series. The SDK manager
          # knows the canonical `ndk;<version>` package and installs to
          # $ANDROID_HOME/ndk/<version> — exactly where gradle's `ndkVersion`
          # and the Bevy build look. `yes |` dies with SIGPIPE once sdkmanager
          # stops reading; neutralize pipefail for the pipeline only.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION"
          rc=$?
          set -o pipefail
          [ "$rc" -eq 0 ] || { echo "::error::sdkmanager failed to install ndk;$NDK_VERSION (rc=$rc)"; exit "$rc"; }
          NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK_ROOT"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Build iced Android Release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-android
          chmod +x android/gradlew
          # Gradle resolves the project from the CWD, so run inside android/;
          # invoking ./android/gradlew from the repo root makes it look for a
          # settings.gradle at the root and fail ("does not contain a Gradle build").
          ( cd android && ./gradlew --no-daemon --stacktrace assembleRelease )
          find android/app/build/outputs/apk -type f -name '*-release.apk' \
            -exec cp {} dist-android/ \;
          test -n "$(find dist-android -type f -name '*.apk' -size +0c -print -quit)"
          find dist-android -type f -name '*.apk' -size +0c -print

      # cargo-apk requires a release keystore. Use the standard Android debug
      # keystore (the same debug key the iced gradle release signs with); the
      # CARGO_APK_RELEASE_* env vars take precedence over the generated driver
      # manifest, so no per-checkout keystore file is needed.
      - name: Ensure Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f "$KEYSTORE"
          echo "CARGO_APK_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"

      # Bevy reuses the exact SDK/NDK/JDK this job already provisioned
      # (BEVY_APK_USE_SYSTEM_TOOLCHAIN=1), so no second ~1.2 GB userspace
      # toolchain is downloaded or cached. BEVY_APK_SKIP_EMULATOR drops the
      # emulator/system image a packaging-only run never uses.
      - name: Build Bevy Android Release APK
        shell: bash
        env:
          BEVY_APK_USE_SYSTEM_TOOLCHAIN: "1"
          BEVY_APK_SKIP_EMULATOR: "1"
        run: bash scripts/build-bevy-apk.sh --release

      - name: Collect Bevy APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-android-bevy
          APK="target/android-tools/apk-driver/target/release/apk/infiltrator-bevy-ui.apk"
          test -s "$APK"
          cp "$APK" dist-android-bevy/
          find dist-android-bevy -type f -size +0c -print

      - name: Upload iced Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Infiltrator-Android-APKs
          path: dist-android/

      - name: Upload Bevy Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Infiltrator-Bevy-Android-APKs
          path: dist-android-bevy/

  # ---------------------------------------------------------------------------
  # 3. Release Publication & Manifest Generation
  # ---------------------------------------------------------------------------
  publish-release:
    name: Generate Manifest & Publish Release
    needs: [build-desktop, build-android]
    # 显式钉最新 LTS（ubuntu-26.04 已 GA），不跟 ubuntu-latest 的静默迁移走。
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts/

      - name: Verify build outputs are present
        shell: bash
        run: |
          set -euo pipefail
          apk_count="$(find all-artifacts -type f -name '*.apk' -size +0c | wc -l)"
          desktop_count="$(find all-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \) -size +0c | wc -l)"
          bevy_count="$(find all-artifacts -type f -iname '*bevy*' -size +0c | wc -l)"
          # Both UI surfaces must ship: the iced desktop matrix plus the Bevy
          # matrix, and one APK per surface.
          test "$apk_count" -ge 2
          test "$desktop_count" -ge 14
          test "$bevy_count" -ge 7
          find all-artifacts -type f -size +0c -print

      - name: Consolidate & Generate Checksums / Manifests
        shell: bash
        run: |
          mkdir -p release-dist
          find all-artifacts/ -type f -exec cp {} release-dist/ \;
          cd release-dist

          # Generate SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS.txt

          # Generate release-manifest.json and latest.json
          python3 ../scripts/generate-release-manifest.py \
            --version "${GITHUB_REF_NAME#v}" \
            --repository "$GITHUB_REPOSITORY" \
            --dist-dir "." \
            --output-manifest "release-manifest.json" \
            --output-latest "latest.json"

      - name: Validate release manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s release-dist/release-manifest.json
          test -s release-dist/latest.json
          test -s release-dist/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("release-dist/release-manifest.json").read_text())
          latest = json.loads(Path("release-dist/latest.json").read_text())
          artifacts = manifest.get("artifacts", [])
          if not artifacts or not latest.get("artifacts") or not latest.get("packages"):
              raise SystemExit("release manifest contains no downloadable artifacts or packages")
          if any(not item.get("sha256") or item.get("size_bytes", 0) <= 0 for item in artifacts):
              raise SystemExit("release manifest contains an invalid artifact record")
          packages = latest.get("packages", [])
          if len(packages) != len(artifacts):
              raise SystemExit(f"packages count ({len(packages)}) does not match artifacts count ({len(artifacts)})")
          if any(not item.get("sha256") or item.get("size", 0) <= 0 or not item.get("target_triple") for item in packages):
              raise SystemExit("latest.json packages contains an invalid package record")
          print(f"validated {len(artifacts)} release artifacts and {len(packages)} updater packages")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*
