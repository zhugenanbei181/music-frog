name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The release tag must pass the exact workspace test suite before any
  # platform build starts. This reusable call prevents a failing test run
  # from racing ahead of publication and avoids a second tag-triggered run.
  test-gate:
    name: Release test gate
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 1. Desktop Build Matrix (Windows, Linux; Apple targets temporarily deferred)
  # ---------------------------------------------------------------------------
  build-desktop:
    needs: [test-gate]
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # 每条腿编译 iced + bevy + slint 三个二进制（共享同一 target/cache）。macOS 与 iOS
    # Apple target 暂停进入自动 CI/release；恢复前不得在 matrix 加回 Apple runner。
    timeout-minutes: 150
    strategy:
      # A failed platform must stop the release fan-out; publish-release is
      # gated on every matrix leg and partial releases are never useful.
      fail-fast: true
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: infiltrator-iced.exe
            bevy_binary_name: infiltrator-bevy-ui.exe
            slint_binary_name: infiltrator-slint.exe
            pkg_format: nsis
            artifact_name: Infiltrator-Windows-x86_64
            bevy_artifact_name: Infiltrator-Bevy-Windows-x86_64
            slint_artifact_name: Infiltrator-Slint-Windows-x86_64
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: infiltrator-iced.exe
            bevy_binary_name: infiltrator-bevy-ui.exe
            slint_binary_name: infiltrator-slint.exe
            pkg_format: zip
            artifact_name: Infiltrator-Windows-aarch64
            bevy_artifact_name: Infiltrator-Bevy-Windows-aarch64
            slint_artifact_name: Infiltrator-Slint-Windows-aarch64
          # Linux x64 —— cargo-zigbuild 把 glibc 下限定桩在 2.17（CentOS 7 /
          # Debian 9 级别），产物兼容性不随构建机系统漂移，runner 始终跟最新
          # LTS；OpenSSL 经 static-openssl feature 静态内联，产物不依赖用户机
          # libssl（deb control 的 Depends 已同步）。iced 与 bevy 共用同一
          # runner/cache，各自出独立安装包（一碗水端平）。
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            tool: zigbuild
            binary_name: infiltrator-iced
            bevy_binary_name: infiltrator-bevy-ui
            slint_binary_name: infiltrator-slint
            pkg_format: linux-all
            artifact_name: Infiltrator-Linux-x86_64
            bevy_artifact_name: Infiltrator-Bevy-Linux-x86_64
            slint_artifact_name: Infiltrator-Slint-Linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify release version and product identity
        shell: bash
        run: python3 scripts/quality/android-product-identity-guard.py --release-tag "$GITHUB_REF_NAME"

      - name: Restore verified platform kernel
        shell: bash
        run: bash scripts/fetch-mihomo.sh --target ${{ matrix.target }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release

      - name: Install cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Setup zig
        if: matrix.tool == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          # 与本地验证过的构建保持同一 zig 版本（GLIBC 2.17 定桩已实测）。
          version: 0.14.1

      - name: Install NSIS
        if: runner.os == 'Windows' && matrix.pkg_format == 'nsis'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            file \
            dpkg-dev

      # zigbuild 对 .2.17 定桩目标会把产物写进 base triple 的目录
      # （target/x86_64-unknown-linux-gnu/release，已实测），与普通构建一致。
      - name: Build Release Binary (zig-pinned glibc floor)
        if: matrix.tool == 'zigbuild'
        run: >
          cargo zigbuild --release --target ${{ matrix.zig_target }}
          -p infiltrator-iced --features static-openssl --bin infiltrator-iced

      - name: Build Release Binary
        if: matrix.tool != 'zigbuild'
        run: cargo build --release --target ${{ matrix.target }} --bin infiltrator-iced

      # -----------------------------------------------------------------------
      # Bevy unified surface: identical platform matrix, its own binary and
      # its own equal package set. Shares this leg's toolchain/cache.
      # -----------------------------------------------------------------------
      - name: Build Bevy Release Binary (zig-pinned glibc floor)
        if: matrix.tool == 'zigbuild'
        run: >
          cargo zigbuild --release --target ${{ matrix.zig_target }}
          -p infiltrator-bevy-ui --features static-openssl --bin infiltrator-bevy-ui

      - name: Build Bevy Release Binary
        if: matrix.tool != 'zigbuild'
        run: cargo build --release --target ${{ matrix.target }} --bin infiltrator-bevy-ui

      - name: Build Slint Release Binary (zig-pinned glibc floor)
        if: matrix.tool == 'zigbuild'
        run: >
          cargo zigbuild --release --target ${{ matrix.zig_target }}
          -p infiltrator-slint --features static-openssl --bin infiltrator-slint

      - name: Build Slint Release Binary
        if: matrix.tool != 'zigbuild'
        run: cargo build --release --target ${{ matrix.target }} --bin infiltrator-slint

      - name: Package Windows Artifacts (NSIS & ZIP)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/infiltrator-iced.exe"
          test -s "$BIN_PATH"

          ZIP_NAME="${{ matrix.artifact_name }}.zip"
          PACKAGE_DIR="dist/windows-iced"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/infiltrator-iced.exe"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo.exe"
          (cd "$PACKAGE_DIR" && 7z a -tzip "../${ZIP_NAME}" .)
          test -s "dist/${ZIP_NAME}"

          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            bash packaging/windows/nsis/build-nsis.sh iced "${GITHUB_REF_NAME#v}" \
              "$BIN_PATH" "dist/Infiltrator-Setup-x86_64.exe"
            test -s "dist/Infiltrator-Setup-x86_64.exe"
          fi

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Package Bevy Windows Artifacts (NSIS & ZIP)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bevy_binary_name }}"
          test -s "$BIN_PATH"

          ZIP_NAME="${{ matrix.bevy_artifact_name }}.zip"
          PACKAGE_DIR="dist/windows-bevy"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/infiltrator-bevy-ui.exe"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo.exe"
          (cd "$PACKAGE_DIR" && 7z a -tzip "../${ZIP_NAME}" .)
          test -s "dist/${ZIP_NAME}"

          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            bash packaging/windows/nsis/build-nsis.sh bevy "${GITHUB_REF_NAME#v}" \
              "$BIN_PATH" "dist/Infiltrator-Bevy-Setup-x86_64.exe"
            test -s "dist/Infiltrator-Bevy-Setup-x86_64.exe"
          fi

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Package Slint Windows Artifacts (NSIS & ZIP)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.slint_binary_name }}"
          test -s "$BIN_PATH"

          ZIP_NAME="${{ matrix.slint_artifact_name }}.zip"
          PACKAGE_DIR="dist/windows-slint"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/infiltrator-slint.exe"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo.exe"
          (cd "$PACKAGE_DIR" && 7z a -tzip "../${ZIP_NAME}" .)
          test -s "dist/${ZIP_NAME}"

          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            bash packaging/windows/nsis/build-nsis.sh slint "${GITHUB_REF_NAME#v}" \
              "$BIN_PATH" "dist/Infiltrator-Slint-Setup-x86_64.exe"
            test -s "dist/Infiltrator-Slint-Setup-x86_64.exe"
          fi

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Package Linux Artifacts (AppImage, Deb & Tarball)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/infiltrator-iced"
          test -s "$BIN_PATH"
          chmod +x "$BIN_PATH"
          ICED_PACKAGE="$(python3 scripts/product_identity.py --get desktop.iced.linux_package_id)"
          ICED_ARTIFACT_PREFIX="$(python3 scripts/product_identity.py --get desktop.iced.release_artifact_prefix)"

          PACKAGE_DIR="dist/linux-iced"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/infiltrator-iced"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo"
          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C "$PACKAGE_DIR" .
          test -s "dist/${{ matrix.artifact_name }}.tar.gz"

          bash packaging/linux/deb/build-deb.sh "$BIN_PATH" \
            "${GITHUB_REF_NAME#v}" "amd64" "dist"
          test -s "dist/${ICED_PACKAGE}_${GITHUB_REF_NAME#v}_amd64.deb"

          bash packaging/linux/appimage/build-appimage.sh "$BIN_PATH"
          test -s "dist/${ICED_ARTIFACT_PREFIX}-Linux-x86_64.AppImage"

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Package Bevy Linux Artifacts (AppImage, Deb & Tarball)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bevy_binary_name }}"
          test -s "$BIN_PATH"
          chmod +x "$BIN_PATH"
          BEVY_PACKAGE="$(python3 scripts/product_identity.py --get desktop.bevy.linux_package_id)"
          BEVY_ARTIFACT_PREFIX="$(python3 scripts/product_identity.py --get desktop.bevy.release_artifact_prefix)"

          PACKAGE_DIR="dist/linux-bevy"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/${{ matrix.bevy_binary_name }}"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo"
          tar -czf "dist/${{ matrix.bevy_artifact_name }}.tar.gz" -C "$PACKAGE_DIR" .
          test -s "dist/${{ matrix.bevy_artifact_name }}.tar.gz"

          APP_PRODUCT=bevy \
            bash packaging/linux/deb/build-deb.sh "$BIN_PATH" \
              "${GITHUB_REF_NAME#v}" "amd64" "dist"
          test -s "dist/${BEVY_PACKAGE}_${GITHUB_REF_NAME#v}_amd64.deb"

          APP_PRODUCT=bevy bash packaging/linux/appimage/build-appimage.sh "$BIN_PATH"
          test -s "dist/${BEVY_ARTIFACT_PREFIX}-Linux-x86_64.AppImage"

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Package Slint Linux Artifacts (AppImage, Deb & Tarball)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.slint_binary_name }}"
          test -s "$BIN_PATH"
          chmod +x "$BIN_PATH"
          SLINT_PACKAGE="$(python3 scripts/product_identity.py --get desktop.slint.linux_package_id)"
          SLINT_ARTIFACT_PREFIX="$(python3 scripts/product_identity.py --get desktop.slint.release_artifact_prefix)"

          PACKAGE_DIR="dist/linux-slint"
          mkdir -p "$PACKAGE_DIR"
          cp "$BIN_PATH" "$PACKAGE_DIR/${{ matrix.slint_binary_name }}"
          bash scripts/fetch-mihomo.sh --target "${{ matrix.target }}" --stage "$PACKAGE_DIR/mihomo"
          tar -czf "dist/${{ matrix.slint_artifact_name }}.tar.gz" -C "$PACKAGE_DIR" .
          test -s "dist/${{ matrix.slint_artifact_name }}.tar.gz"

          APP_PRODUCT=slint \
            bash packaging/linux/deb/build-deb.sh "$BIN_PATH" \
              "${GITHUB_REF_NAME#v}" "amd64" "dist"
          test -s "dist/${SLINT_PACKAGE}_${GITHUB_REF_NAME#v}_amd64.deb"

          APP_PRODUCT=slint bash packaging/linux/appimage/build-appimage.sh "$BIN_PATH"
          test -s "dist/${SLINT_ARTIFACT_PREFIX}-Linux-x86_64.AppImage"

          find dist -maxdepth 1 -type f -size +0c -print

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  # ---------------------------------------------------------------------------
  # 2. Android APK Build Job (Compose + Bevy + Slint share one host and SDK/NDK/JDK)
  # ---------------------------------------------------------------------------
  build-android:
    needs: [test-gate]
    name: Build Android APKs (Compose + Bevy + Slint)
    # 显式钉最新 LTS（ubuntu-26.04 已 GA），不跟 ubuntu-latest 的静默迁移走。
    runs-on: ubuntu-26.04
    # 三种产品由同一 Gradle application module 的独立 flavor 构建，
    # 共用 VPN 宿主、权限定义、状态服务和 Android 工具链。
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Android product identity registry and release tag
        shell: bash
        run: python3 scripts/quality/android-product-identity-guard.py --release-tag "$GITHUB_REF_NAME"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # BANDROID-024: the Compose host compiles against API 37 (latest stable
      # AndroidX/Compose). Install the platform and build-tools explicitly.
      - name: Install Android platform 37 and build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;37.0.0"
          rc=$?
          set -o pipefail
          [ "$rc" -eq 0 ] || { echo "::error::sdkmanager failed to install platform 37 (rc=$rc)"; exit "$rc"; }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="29.0.14206865"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # nttld/setup-ndk builds `android-ndk-<version>-linux.zip` from the
          # numeric version, which 404s for the r29 series. The SDK manager
          # knows the canonical `ndk;<version>` package and installs to
          # $ANDROID_HOME/ndk/<version> — exactly where gradle's `ndkVersion`
          # and the Bevy build look. `yes |` dies with SIGPIPE once sdkmanager
          # stops reading; neutralize pipefail for the pipeline only.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION"
          rc=$?
          set -o pipefail
          [ "$rc" -eq 0 ] || { echo "::error::sdkmanager failed to install ndk;$NDK_VERSION (rc=$rc)"; exit "$rc"; }
          NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK_ROOT"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Build all Android release flavors
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          # Gradle resolves the project from the CWD, so run inside android/.
          ( cd android && ./gradlew --no-daemon --stacktrace \
            :core-host-tests:test \
            :app:assembleComposeRelease :app:assembleBevyRelease :app:assembleSlintRelease )

      - name: Verify and collect registered Android APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-android dist-android-bevy dist-android-slint
          PRODUCT_VERSION="$(python3 scripts/product_identity.py --get version.name)"
          COMPOSE_ARTIFACT_PREFIX="$(python3 scripts/product_identity.py --get compose.release_artifact_prefix)"
          BEVY_ARTIFACT_PREFIX="$(python3 scripts/product_identity.py --get bevy.release_artifact_prefix)"
          SLINT_ARTIFACT_PREFIX="$(python3 scripts/product_identity.py --get slint.release_artifact_prefix)"
          echo "COMPOSE_ARTIFACT_PREFIX=$COMPOSE_ARTIFACT_PREFIX" >> "$GITHUB_ENV"
          echo "BEVY_ARTIFACT_PREFIX=$BEVY_ARTIFACT_PREFIX" >> "$GITHUB_ENV"
          echo "SLINT_ARTIFACT_PREFIX=$SLINT_ARTIFACT_PREFIX" >> "$GITHUB_ENV"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          COMPOSE_APK="android/app/build/outputs/apk/compose/release/app-compose-universal-release.apk"
          BEVY_APK="android/app/build/outputs/apk/bevy/release/app-bevy-universal-release.apk"
          SLINT_APK="android/app/build/outputs/apk/slint/release/app-slint-universal-release.apk"
          test -s "$COMPOSE_APK"
          test -s "$BEVY_APK"
          test -s "$SLINT_APK"
          python3 scripts/quality/android-product-identity-guard.py \
            --aapt "$AAPT" --apk "compose=$COMPOSE_APK"
          python3 scripts/quality/android-product-identity-guard.py \
            --aapt "$AAPT" --apk "bevy=$BEVY_APK"
          python3 scripts/quality/android-product-identity-guard.py \
            --aapt "$AAPT" --apk "slint=$SLINT_APK"
          cp "$COMPOSE_APK" "dist-android/${COMPOSE_ARTIFACT_PREFIX}-${PRODUCT_VERSION}-universal-release.apk"
          cp "$BEVY_APK" "dist-android-bevy/${BEVY_ARTIFACT_PREFIX}-${PRODUCT_VERSION}-universal-release.apk"
          cp "$SLINT_APK" "dist-android-slint/${SLINT_ARTIFACT_PREFIX}-${PRODUCT_VERSION}-universal-release.apk"
          find dist-android dist-android-bevy dist-android-slint -type f -name '*.apk' -size +0c -print

      - name: Upload Compose Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COMPOSE_ARTIFACT_PREFIX }}-APKs
          path: dist-android/

      - name: Upload Bevy Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BEVY_ARTIFACT_PREFIX }}-APKs
          path: dist-android-bevy/

      - name: Upload Slint Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SLINT_ARTIFACT_PREFIX }}-APKs
          path: dist-android-slint/

  # ---------------------------------------------------------------------------
  # 3. Release Publication & Manifest Generation
  # ---------------------------------------------------------------------------
  publish-release:
    name: Generate Manifest & Publish Release
    needs: [build-desktop, build-android]
    # 显式钉最新 LTS（ubuntu-26.04 已 GA），不跟 ubuntu-latest 的静默迁移走。
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts/

      - name: Verify build outputs are present
        shell: bash
        run: |
          set -euo pipefail
          apk_count="$(find all-artifacts -type f -name '*.apk' -size +0c | wc -l)"
          desktop_count="$(find all-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \) -size +0c | wc -l)"
          bevy_count="$(find all-artifacts -type f -iname '*bevy*' -size +0c | wc -l)"
          slint_count="$(find all-artifacts -type f -iname '*slint*' -size +0c | wc -l)"
          # All three UI products ship across the supported desktop matrix and
          # each has a separately identified Android APK.
          test "$apk_count" -ge 3
          test "$desktop_count" -ge 18
          test "$bevy_count" -ge 7
          test "$slint_count" -ge 6
          find all-artifacts -type f -size +0c -print

      - name: Consolidate & Generate Checksums / Manifests
        shell: bash
        run: |
          mkdir -p release-dist
          # Only consolidate official end-user packages (installers, packages, archives and APKs).
          # Filter out intermediate build artifacts (bare core binaries, internal plists, license txts, build json metadata).
          find all-artifacts/ -type f \( \
            -name 'Infiltrator*.exe' -o \
            -name 'Infiltrator*.dmg' -o \
            -name 'Infiltrator*.AppImage' -o \
            -name '*.deb' -o \
            -name 'Infiltrator*.tar.gz' -o \
            -name 'Infiltrator*.zip' -o \
            -name 'Infiltrator*.apk' \
          \) -exec cp {} release-dist/ \;
          cd release-dist

          # Generate SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS.txt

          # Generate release-manifest.json and latest.json
          python3 ../scripts/generate-release-manifest.py \
            --version "${GITHUB_REF_NAME#v}" \
            --repository "$GITHUB_REPOSITORY" \
            --dist-dir "." \
            --output-manifest "release-manifest.json" \
            --output-latest "latest.json"

      - name: Validate release manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s release-dist/release-manifest.json
          test -s release-dist/latest.json
          test -s release-dist/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("release-dist/release-manifest.json").read_text())
          latest = json.loads(Path("release-dist/latest.json").read_text())
          artifacts = manifest.get("artifacts", [])
          if not artifacts or not latest.get("artifacts") or not latest.get("packages"):
              raise SystemExit("release manifest contains no downloadable artifacts or packages")
          if any(not item.get("sha256") or item.get("size_bytes", 0) <= 0 for item in artifacts):
              raise SystemExit("release manifest contains an invalid artifact record")
          packages = latest.get("packages", [])
          if len(packages) != len(artifacts):
              raise SystemExit(f"packages count ({len(packages)}) does not match artifacts count ({len(artifacts)})")
          if any(not item.get("sha256") or item.get("size", 0) <= 0 or not item.get("target_triple") for item in packages):
              raise SystemExit("latest.json packages contains an invalid package record")
          print(f"validated {len(artifacts)} release artifacts and {len(packages)} updater packages")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*
