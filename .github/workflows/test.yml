name: test

# 默认关闭：普通 push（main/日常分支）与普通 PR 不执行任何测试。
# 版本 tag 由 release.yml 通过 workflow_call 进入同一测试 gate；本文件直接
# 处理 v* / release/v* 版本分支，以及标题或源分支带版本号的 PR。
on:
  # Release invokes this workflow as a reusable, blocking test gate. Keeping
  # tag execution in release.yml avoids running the same suite twice.
  workflow_call:
  push:
    branches:
      - "v*"
      - "release/v*"
  pull_request:
    types: [opened, synchronize, reopened]

# 同一引用的新提交自动取消旧运行：过时结果尽早退出，不浪费算力。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 中禁用增量编译：产物更小、缓存更省、全量构建更可复现。
  CARGO_INCREMENTAL: 0

jobs:
  version-gate:
    # 免 checkout 的 10 秒门卫：不带版本号的 PR 在这里即被跳过，不进编译队列。
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Version branches are filtered above; release tags arrive through
          # workflow_call. Only pull requests need the title/source-branch check.
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_call" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          elif printf '%s' "$TITLE$HEAD_REF" | grep -Eqi 'v[0-9]+(\.[0-9]+)*'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi

  test:
    needs: version-gate
    if: needs.version-gate.outputs.run == 'true'
    name: nextest (network-isolated, 4 threads)
    # 显式钉最新 LTS（ubuntu-26.04 已 GA），不跟 ubuntu-latest 的静默迁移走。
    runs-on: ubuntu-26.04
    # Bevy 入 workspace 后全量编译（iced+bevy+全部 crate）显著变重；30 分钟会
    # 在冷缓存下超时，超时=整轮 gate 报废。放宽到 60 给冷缓存留余量。
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 守卫脚本需要 Python 3.11+ 的 tomllib；显式钉版本，不赌 runner 镜像默认值。
      - name: Setup Python for quality guards
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # 廉价守卫前置（秒级）：在任何工具链安装、缓存与编译之前失败，尽早退出。
      # 守卫清单的唯一权威是 scripts/test.sh 本身，这里只调用、不复述清单。
      - name: Verify test policy
        run: bash scripts/check-test-policy.sh

      - name: Enforce quality guards (fail fast)
        run: bash scripts/test.sh --guards-only

      # 每次运行都解析为仓库钉死的 1.99.0 工具链（rust-toolchain.toml channel=1.99.0 同轨）。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@latest

      # 缓存 registry/git/ target 三层；key 随 Cargo.lock 自动变化。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 编译工作空间所需的系统依赖（--no-install-recommends 精简安装）：
      # - iced/gtk/wayland: libgtk-3-dev libglib2.0-dev libxkbcommon-dev libwayland-dev
      # - 音频/设备: libasound2-dev libudev-dev
      # - native-tls: libssl-dev pkg-config
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libglib2.0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libssl-dev \
            pkg-config

      # 第一步：在有网络的环境中预编译全部测试目标（此时仅解析/下载依赖并编译，
      # mockito 等 mock server 尚未启动，不会有任何真实请求发出）。
      # scripts/test.sh 的守卫段会在编译前先行执行（--guards-only 已跑过，此处
      # 属全量脚本自身流程的一部分）。
      - name: Pre-compile tests (network allowed)
        run: bash scripts/test.sh --no-run

      # 第二步：在无外网的命名空间中运行完整测试套件。
      #
      # 测试安全策略：
      # 1. 测试绝不访问外网 —— 所有 HTTP mock（mockito）只绑定 127.0.0.1 回环地址；
      # 2. 测试绝不启动真实的 mihomo 二进制 —— 只有生产代码允许调用 spawn_daemon；
      # 3. CI 用 `unshare -n` 强制执行以上策略：网络命名空间内只保留 loopback
      #    接口（mockito 需要），任何意外的外网请求都会直接失败，而不是侥幸通过。
      #
      # 说明：通过 `env` 透传 PATH/HOME，保证 sudo 降层后仍使用同一套
      # rustup/cargo 安装与缓存（上一步已预编译，此阶段 cargo 无需联网）。
      - name: Run tests in network-isolated namespace (loopback only)
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" unshare -n bash -c \
            'ip link set lo up && bash scripts/test.sh'
