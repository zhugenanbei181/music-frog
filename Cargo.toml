[workspace]
resolver = "2"
# 双路构建面：核心 + Iced 桌面产品线 + Bevy 统一产品线。
# - WebUI/Tauri 已退役（台账：docs/TAURI_WEBUI_RETIREMENT_LEDGER.md）。
# - Iced 是当前主桌面 surface（winit/wgpu）。
# - Bevy 是战略统一 surface（桌面 + 移动 + iOS 大一统）。
# - 两个前端共享核心业务 crate，进程内直接调用。
members = [
  "crates/mihomo-api",
  "crates/mihomo-config",
  "crates/mihomo-platform",
  "crates/mihomo-version",
  "crates/infiltrator-domain",
  "crates/infiltrator-contract",
  "crates/infiltrator-ports",
  "crates/infiltrator-core",
  "crates/infiltrator-http",
  "crates/infiltrator-admin",
  "crates/infiltrator-desktop",
  "crates/infiltrator-android",
  "crates/infiltrator-shared",
  "crates/mihomo-dav-sync/dav-client",
  "crates/mihomo-dav-sync/sync-engine",
  "crates/mihomo-dav-sync/state-store",
  "crates/mihomo-dav-sync/indexer",
  "crates/mihomo-dav-sync/platform-android",
  "crates/infiltrator-iced",
  "crates/infiltrator-cli",
  "crates/infiltrator-bevy-widgets",
  "crates/infiltrator-bevy-ui"]

[workspace.dependencies]
# Network & Async
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "socks", "stream", "http2"] }
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Data Handling
quick-xml = { version = "0.42", features = ["serialize", "async-tokio"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
axum = "0.8"
brotli = "8.0"
tower-http = { version = "0.7", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Utility
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
glob = "0.3"
md5 = "0.7"

serde_json = "1.0"
log = "0.4"
toml = "0.8"
yaml-rust2 = "0.11"
serde_yaml_ng = "0.10"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_Foundation", "Win32_Security"] }
libc = "0.2"
keyring = { version = "4.1" }
winreg = "0.56"

futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
dirs = "6.0"
flate2 = "1.1"
sha2 = "0.11"
zip = "8.6"
sysinfo = "0.39"
jni = "0.21"
tokio-stream = "0.1"
uniffi = "0.32"
uniffi_bindgen = "0.32"
# default-features = false drops tray-icon/muda's optional libxdo (X11 menu
# accelerators, unused) so Linux builds do not require the xdotool system library.
# Since muda 0.19 / tray-icon 0.24 the Linux gtk backend itself is also a feature
# and must be requested explicitly.
muda = { version = "0.19", default-features = false, features = ["gtk"] }
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
# Linux StatusNotifierItem (D-Bus) tray, GTK-free. ksni requires exactly one
# executor feature: "tokio" is chosen because this app already runs tokio, so
# no extra async-io executor stack is pulled in; "blocking" adds the
# synchronous spawn/handle API the tray backend uses off the async paths.
ksni = { version = "0.3", default-features = false, features = ["tokio", "blocking"] }
# 0.20 OS 系统通知（Linux/*BSD）：默认特性关闭，"z" 是 zbus 纯 Rust 后端，
# 与 ksni 共享 zbus 5 依赖树；刻意不启用 d/d_vendored（C libdbus）后端。
notify-rust = { version = "4.12", default-features = false, features = ["z"] }
tempfile = "3.27"
mockito = "1.7"
clap = { version = "4.6", features = ["derive"] }
regex = "1.11"

# Bevy UI (战略统一 surface，锁定 =0.19.1 与 taskmanager 同锁)
bevy = { version = "=0.19.1", default-features = false }
accesskit = "0.24.1"
unicode-segmentation = "1.12"
