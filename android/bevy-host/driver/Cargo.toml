# BANDROID-003/004 — Bevy Android native driver (template, isolated).
#
# This crate is NOT a member of the repository workspace (it declares its own
# empty [workspace] so `cargo build --workspace` at the repo root ignores it).
# It is built by android/bevy-host/build.gradle.kts for shipped Android ABIs.
#
# See ../README.md for build and device evidence status.

[package]
name = "infiltrator-bevy-android-driver"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# The NativeActivity `android.app.lib_name` declared on BevyHostActivity.
name = "infiltrator_bevy_android"
crate-type = ["cdylib"]

[dependencies]
# The NativeActivity driver owns only the Bevy surface. Android application
# state and commands are obtained through the typed :vpn IPC client.
infiltrator-bevy-ui = { path = "../../../crates/infiltrator-bevy-ui", default-features = false }
infiltrator-contract = { path = "../../../crates/infiltrator-contract" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
bevy_android = "=0.20.0"
jni = "0.22.4"

[workspace]
