# BANDROID-044.2: Detekt configuration for the Android product flavors.
#
# The rules that are active here are the Detekt defaults plus the explicit
# overrides below. There is no baseline file, no per-file `@Suppress` and no
# raised issue threshold: `maxIssues` stays at its default of 0, so a single
# finding fails `:app:detekt`.
#
# Every deviation below names the owner that replaces the Detekt rule, so the
# excluded concerns stay machine-enforced somewhere else:
#
#   * formatting and layout            -> ktlint (`:app:ktlintCheck`)
#   * Kotlin file size budget          -> scripts/quality/kt-line-guard.py
#   * state machine shape              -> scripts/quality/typed-state-guard.py
#   * catch / cancellation discipline  -> scripts/quality/android-architecture-redline-guard.py
#
# `scripts/quality/android-architecture-redline-guard.py` also pins the set of
# rules excluded below, so this file cannot grow an unreviewed exemption.

complexity:
  active: true
  # The repository owns Kotlin file size with an 800-line budget per hand
  # written file (scripts/quality/kt-line-guard.py, BANDROID-044.3). Detekt's
  # 600-line class limit measures a different unit and flagged 4 Compose
  # screens that are already inside the file budget.
  LargeClass:
    active: false
  # Detekt's complexity defaults (15 branches, 60 lines, 6 parameters, 11
  # functions, 4 nested blocks) are calibrated for small pure-Kotlin
  # libraries. They flagged the whole Compose product surface without
  # pointing at a defect: 74 cyclomatic, 54 long-method, 42 too-many-function,
  # 20 long-parameter-list, 18 complex-condition and 17 nested-block findings.
  # The shape of the product surface is owned by the typed-state guard and by
  # the 800-line file budget, both of which are already enforced.
  ComplexCondition:
    active: false
  CyclomaticComplexMethod:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: false
  TooManyFunctions:
    active: false

exceptions:
  active: true
  # The Android host bridges JNI/FFI, process and socket boundaries where the
  # thrown type is not statically known, so 65 `catch (e: Exception)` sites
  # exist. The catch discipline this rule approximates is owned by the
  # architecture red-line guard, which is stricter: it forbids empty catch
  # blocks and swallowed cancellation outright, and it requires every narrow
  # exception to carry a local explanation plus a behaviour regression.
  TooGenericExceptionCaught:
    active: false

naming:
  active: true
  # Jetpack Compose composable functions are PascalCase by convention, the
  # same convention the Compose compiler and the Android Studio template use.
  # The rule stays active for every other function.
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']

performance:
  active: true
  # A spread argument is the deliberate shape of the wire payloads that the
  # owner passes through unchanged.
  SpreadOperator:
    active: false

style:
  active: true
  # ktlint owns line length: `standard:max-line-length` runs with the
  # ktlint_official limit of 140 columns, so a second, stricter limit here
  # would only duplicate the same concern with a different number.
  MaxLineLength:
    active: false
  # ktlint owns wildcard imports (`standard:no-wildcard-imports`).
  WildcardImport:
    active: false
  # ktlint owns the final newline (`standard:final-newline`).
  NewLineAtEndOfFile:
    active: false
  # The product wire owners publish protocol and unit facts as literals next
  # to the branch that consumes them; naming all 170 of them constants would
  # be a semantic rewrite, not a defect fix. The typed wire owners in
  # `ui/common` and the core host tests are the single source for those
  # values.
  MagicNumber:
    active: false
  # Guard clauses are the idiomatic Kotlin shape for a typed owner, and the
  # state machine shape is owned by scripts/quality/typed-state-guard.py.
  ReturnCount:
    active: false
  # The rule counts thrown types; the architecture red-line guard owns the
  # meaningful property, that a narrow exception carries a local explanation
  # and a behaviour regression.
  ThrowsCount:
    active: false
  # `check` marks an internal invariant of the host, `require` marks an
  # invalid argument of a public wire entry point. The Android host uses
  # both deliberately, so Detekt's "always prefer one of them" advice would
  # erase that distinction.
  UseCheckOrError:
    active: false
  UseRequire:
    active: false
  # A function that returns a constant is the intended shape of the small
  # request builders in the test sources.
  FunctionOnlyReturningConstant:
    active: false
