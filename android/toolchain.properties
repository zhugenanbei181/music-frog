# Shared Android build inputs consumed by Gradle, CI and local scripts.
java.distribution=temurin
# The JDK that builds everything: Gradle, AGP, the Kotlin compiler, Ktlint,
# Detekt and the JVM test harness run on this. It is deliberately the newest LTS
# the *whole* gate chain executes on, not the newest LTS in existence: JDK 25 is
# blocked upstream because Detekt 1.23.8 (the latest release) crashes on a 25
# runtime parsing its version string (detekt/detekt#8980), and Gradle 9.7 plus
# AGP 9.3 do support 25. Moving this forward is a Detekt release note, not a
# local edit. AGP 9.3's own JDK 17 Lint crash is a further reason not to sit on
# 17. This is NOT the level compiled into the APK.
java.major=21
# The Java language and bytecode level emitted into the APK and the JVM harness.
# A separate fact from the build JDK: D8/ART and the pinned Detekt both cap it,
# so raising the build JDK must never silently raise this, and pinning this must
# never silently downgrade the build JDK.
java.bytecode.target=17
java.bootstrap.version=21.0.13+9
java.bootstrap.directory=jdk-21.0.13+9
java.bootstrap.url=https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz
android.compile.sdk=37
android.sdk.platform=37.0
android.min.sdk=29
android.target.sdk=36
android.build.tools=36.0.0
android.emulator.api=36
android.emulator.image=default;x86_64
android.ndk.version=29.0.14206865
android.cmdline.tools.revision=11076708
android.cmdline.tools.version=12.0
