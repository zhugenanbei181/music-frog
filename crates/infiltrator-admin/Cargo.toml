infiltrator-application = { path = "../infiltrator-application" }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-domain = { path = "../infiltrator-domain" }
infiltrator-ports = { path = "../infiltrator-ports" }
infiltrator-shared = { path = "../infiltrator-shared" }
log = { workspace = true }
mihomo-config = { path = "../mihomo-config" }
infiltrator-platform = { path = "../infiltrator-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tower-http = { workspace = true, features = ["fs"] }
