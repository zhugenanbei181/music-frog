[package]
name = "infiltrator-android"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[features]
default = []
slint-ui = ["dep:infiltrator-slint", "dep:slint"]

[dependencies]
lurker-core-ports = { path = "../lurker-core-ports" }
lurker-core-contract = { path = "../lurker-core-contract" }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
infiltrator-application = { path = "../infiltrator-application" }
infiltrator-composition = { path = "../infiltrator-composition" }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-domain = { path = "../infiltrator-domain" }
infiltrator-ports = { path = "../infiltrator-ports" }
infiltrator-profile-store = { path = "../infiltrator-profile-store" }
lurker-profile-store = { path = "../lurker-profile-store" }
infiltrator-shared = { path = "../infiltrator-shared" }
thiserror = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
mihomo-api = { path = "../mihomo-api" }
mihomo-config = { path = "../mihomo-config" }
infiltrator-platform = { path = "../infiltrator-platform" }
infiltrator-presentation = { path = "../infiltrator-presentation" }
singbox-api = { path = "../singbox-api" }
singbox-config = { path = "../singbox-config" }
singbox-process = { path = "../singbox-process" }
singbox-version = { path = "../singbox-version" }
infiltrator-core = { path = "../infiltrator-core" }
reqwest = { workspace = true, default-features = false, features = ["json", "socks", "stream", "http2"] }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
chrono = { workspace = true }
uniffi = { workspace = true, features = ["tokio", "cli"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
infiltrator-slint = { path = "../infiltrator-slint", default-features = false, optional = true }
slint = { workspace = true, features = ["backend-android-activity-06"], optional = true }
reqwest = { workspace = true, default-features = false, features = ["rustls-no-provider"] }
rustls = { workspace = true }
tun2proxy = "0.5"
tun2 = { version = "3", features = ["async"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["native-tls"] }

[build-dependencies]
camino = "1.0.8"

[dev-dependencies]
tempfile = { workspace = true }
syn = { workspace = true }
