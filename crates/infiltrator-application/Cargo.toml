[package]
name = "infiltrator-application"
version = "0.30.0"
edition = "2024"
publish = false
description = "Runtime-neutral application services over MusicFrog ports."

[features]
# DUAL-10-01: the real ECMAScript engine is part of the default build. The
# Boa adapter is compiled and the shared scripting-sandbox matrix executes a
# real JS engine in the default `cargo build` / `bash scripts/test.sh`; the
# bundled directive DSL stays the default *selected* engine per host. The
# feature remains optional so `--no-default-features` can drop it, which
# honestly degrades the matrix row back to `planned`. See
# docs/SCRIPT_ENGINE_DECISION.md §5.
default = ["script-engine-boa"]
script-engine-boa = ["dep:boa_engine"]

[dependencies]
async-trait = { workspace = true }
boa_engine = { workspace = true, optional = true }
chrono = { workspace = true }
futures-util = { workspace = true }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-domain = { path = "../infiltrator-domain" }
infiltrator-ports = { path = "../infiltrator-ports" }
log = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
[dev-dependencies]
tokio = { workspace = true }
