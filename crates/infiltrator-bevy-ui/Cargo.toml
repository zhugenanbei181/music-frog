[package]
name = "infiltrator-bevy-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bevy UI frontend shell for MusicFrog Infiltrator: the strategic unified desktop+mobile surface."

# The Bevy frontend is the strategic surface whose ceiling includes mobile
# (iced has no Android story; bevy runs the same tree on aarch64-linux-android).
[dependencies]
infiltrator-bevy-widgets = { path = "../infiltrator-bevy-widgets" }

# AccessKit node/role vocabulary for the shell's semantic nodes. Direct dep
# because bevy_a11y 0.19 no longer re-exports the crate.
accesskit = { workspace = true }
infiltrator-contract = { path = "../infiltrator-contract" }

# Base `bevy` declaration with an EMPTY feature set; the per-target tables
# below own the real closure (bevy derive macros scan this plain table).
bevy = { workspace = true }

# The application-owned controller pump (BEVY-005).
infiltrator-application = { path = "../infiltrator-application" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "accesskit_unix",
    "wayland",
    "system_font_discovery",
] }

# Android (BEVY-006): the strategic mobile target.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "android-native-activity",
    "system_font_discovery",
] }
blake3 = { version = "1.8", default-features = false, features = ["no_neon"] }

# Everything that is neither the Linux desktop nor Android.
[target.'cfg(not(any(target_os = "android", all(target_os = "linux", not(target_os = "android")))))'.dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "system_font_discovery",
] }

[lib]
name = "infiltrator_bevy_ui"
path = "src/lib.rs"

# BEVY-006 back half (M3): Android APK packaging metadata for cargo-apk.
[package.metadata.android]
package = "app.musicfrog.infiltrator_bevy_ui"
apk_name = "infiltrator-bevy-ui"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "MusicFrog Infiltrator Bevy"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
