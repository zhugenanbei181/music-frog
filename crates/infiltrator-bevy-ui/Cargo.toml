[package]
name = "infiltrator-bevy-ui"
version.workspace = true
edition = "2024"
publish = false
description = "Bevy UI frontend shell for MusicFrog Infiltrator: a peer desktop+mobile product."

# Bevy and Iced are peer products; mobile support is a separate platform axis.
[features]
# DUAL-10-01: forward the real-ECMAScript engine to the shared application. It
# is on by default, matching the application's default configuration, so the
# Bevy surface is built and tested against Boa unless defaults are disabled.
default = ["script-engine-boa", "ui-application-projections"]
script-engine-boa = ["dep:infiltrator-application", "infiltrator-application/script-engine-boa"]
# The existing page layer still consumes runtime-neutral presentation helpers
# from infiltrator-application. This feature is deliberately distinct from the
# desktop/capture host adapters so Android can compile the UI without linking
# those runtime compositions.
ui-application-projections = ["dep:infiltrator-application"]
# Isolated screenshot/demo tooling. This feature is opt-in and is not part of
# the product defaults or Android product driver closure.
capture-tools = [
    "dep:infiltrator-composition",
    "dep:infiltrator-application",
    "dep:infiltrator-test-support",
    "infiltrator-composition/capture-fixtures",
]
# Explicit opt-in for the legacy controller-only live Overview capture adapter.
capture-controller = ["capture-tools"]
# Linux release: statically vendor OpenSSL so the artifact carries no libssl
# soname dependency and can be produced against the pinned old glibc via
# cargo-zigbuild (same contract as infiltrator-iced's identically named
# feature; the TLS stack enters through reqwest / tokio-tungstenite native-tls).
static-openssl = ["dep:openssl", "openssl/vendored"]

[dependencies]
zhuge-ui-core.workspace = true
infiltrator-bevy-widgets = { path = "../infiltrator-bevy-widgets" }

# AccessKit node/role vocabulary for the shell's semantic nodes. Direct dep
# because bevy_a11y no longer re-exports the crate.
accesskit = { workspace = true }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-domain = { path = "../infiltrator-domain" }
infiltrator-presentation = { path = "../infiltrator-presentation" }
infiltrator-composition = { path = "../infiltrator-composition", optional = true }
infiltrator-test-support = { path = "../infiltrator-test-support", optional = true }
infiltrator-shared = { path = "../infiltrator-shared" }

# Base `bevy` declaration with an EMPTY feature set; the per-target tables
# below own the real closure (bevy derive macros scan this plain table).
bevy = { workspace = true }

# The application-owned controller pump (BEVY-005).
infiltrator-application = { path = "../infiltrator-application", default-features = false, optional = true }
infiltrator-ports = { path = "../infiltrator-ports" }
serde = { workspace = true }
serde_json = { workspace = true }

# TLS enters through reqwest / tokio-tungstenite native-tls. The optional
# openssl crate is declared (Linux only, unused directly) so the
# `static-openssl` feature can turn on its vendored switch and statically link
# OpenSSL into the Linux release artifact. Mirrors infiltrator-iced.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", optional = true }

[dev-dependencies]
infiltrator-application = { path = "../infiltrator-application", default-features = false }
infiltrator-composition = { path = "../infiltrator-composition", features = ["capture-fixtures"] }
infiltrator-test-support = { path = "../infiltrator-test-support" }
tempfile = { workspace = true }
mockito = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_feathers",
    "custom_cursor",
    "debug",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "touch",
    "accesskit_unix",
    "wayland",
    "system_font_discovery",
    "system_clipboard",
] }

# Android (BEVY-006): the strategic mobile target.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_feathers",
    "custom_cursor",
    "debug",
    "bevy_clipboard",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "touch",
    "android-native-activity",
    "system_font_discovery",
] }
blake3 = { version = "1.8", default-features = false, features = ["no_neon"] }

# Everything that is neither the Linux desktop nor Android.
[target.'cfg(not(any(target_os = "android", all(target_os = "linux", not(target_os = "android")))))'.dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_feathers",
    "custom_cursor",
    "debug",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "touch",
    "system_font_discovery",
    "bevy_clipboard",
] }

[lib]
name = "infiltrator_bevy_ui"
path = "src/lib.rs"

# The headless page matrix intentionally uses demo projections and capture
# fixtures. Product defaults do not carry those fixtures into shipped builds.
[[test]]
name = "headless"
path = "tests/headless.rs"
required-features = ["capture-tools"]

# BEVY-006 back half (M3): Android APK packaging metadata for cargo-apk.
[package.metadata.android]
package = "app.musicfrog.infiltrator_bevy_ui"
apk_name = "infiltrator-bevy-ui"
res = "../../android/app/src/main/res"
build_targets = ["aarch64-linux-android"]

# BANDROID-020: keep min/target SDK identical to the Compose host
# (android/app/build.gradle.kts). The generated APK driver crate in
# scripts/build-bevy-apk.sh carries the permissions; this table must not drift.
[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 36

[package.metadata.android.application]
label = "MusicFrog Infiltrator Bevy"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
icon = "@drawable/ic_app_icon"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
bevy = { workspace = true, features = ["system_clipboard"] }
