[package]
name = "infiltrator-bevy-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Business-agnostic Bevy UI widget layer for MusicFrog: bsn! scene functions over the official unstyled bevy_ui_widgets."

# Business-agnostic by law (crates/infiltrator-bevy-ui/docs/BEVY_UI_FRONTEND.md): this crate uses Bevy, Unicode and shared copy resources — never application
# engines, infiltrator-core or mihomo-*. Shared BSN roots are owned by
# zhuge-ui-kit-bevy; this crate retains MusicFrog theme, copy and widget adapters.
# Bevy is pinned to the same patch (`=0.20.1`) as the shared scene owner.

# Base `bevy` declaration enables Feathers' theme projection because this
# crate imports it in all targets. Per-target tables below own the remaining
# host feature closure; the plain dependency also keeps Bevy derive macros
# (`Event`/`Component`/`Resource`) able to resolve `::bevy::…` paths.
[dependencies]
zhuge-ui-kit-bevy.workspace = true
zhuge-ui-core.workspace = true
accesskit = { workspace = true }
bevy = { workspace = true, features = ["bevy_feathers"] }
unicode-segmentation = { workspace = true }
infiltrator-shared = { path = "../infiltrator-shared" }

# Feature closure (minimal for a bevy_ui surface), locked `=0.20.1`:
# - bevy_ui: the toolkit layer itself (its layout plugin; pulls bevy_text and
#   bevy_sprite; nothing 3D).
# - bevy_ui_widgets: the official unstyled widget package (button / checkbox /
#   radio / scrollarea / slider / text_input / menu / popover semantics).
#   Interaction components remain ours; Feathers supplies only its theme
#   projection API, connected to our design tokens.
# - bevy_scene: the `bsn!` (Bevy Scene Notation) macro and the `Scene` /
#   `CommandsSceneExt` spawn seam. Charter law: static structure composes
#   declaratively with `bsn!`; no imperative `Node`/`Children` trees.
# - bevy_ui_render: bevy 0.20 splits ui layout from ui rendering, so
#   `bevy_ui` alone lays nodes out without ever painting them.
# - bevy_core_pipeline / bevy_render: the render-graph host the ui render
#   node plugs into.
# - bevy_asset: AssetPlugin, i.e. the Assets<Font>/Assets<Image> stores.
# - png: the only image codec this layer needs — the shared asset catalog's
#   64px RGBA icon plates are decoded into the host image store.
# - bevy_winit: the window/event-loop host; no raw winit use of our own.
# - bevy_text: font shaping through cosmic-text, chosen explicitly.
# - ui_picking: the picking/message infrastructure the 0.20 widget observers
#   require (pointer release / IME queues).
# - wayland (Linux only): winit backend selection. The X11 sessions stay
#   carried by the iced frontend; revisit when bevy becomes the only surface.
# - default-features off: no audio, no gilrs, no 3D, no dynamic linking, no
#   dev-tools. `multi_threaded` stays off so headless tests can observe the
#   render pass inline on the app thread.
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_feathers",
    "custom_cursor",
    "debug",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "png",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "wayland",
    # system_font_discovery: parley/fontique system-font fallback. Without it
    # the font db holds only the embedded Latin faces and every zh-CN label
    # renders as tofu (observed in bevy capture round 1). In lockstep in
    # every bevy table of both bevy crates.
    "system_font_discovery",
] }

# Android (the reason this frontend exists), BEVY-006 front half: same UI
# closure as desktop, minus `wayland` (winit backend selection is a desktop
# compositor concern), plus `android-native-activity` — the one feature bevy
# 0.20.1 offers to satisfy android-activity's hard requirement.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_feathers",
    "custom_cursor",
    "debug",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "png",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "android-native-activity",
    "system_font_discovery",
] }
# bevy_asset pulls blake3; on aarch64 it cc-compiles NEON C which needs the
# NDK C compiler. `no_neon` pins the portable Rust implementation.
blake3 = { version = "1.8", default-features = false, features = ["no_neon"] }

# Everything that is neither the Linux desktop nor Android — today macOS and
# Windows — keeps the windowing-agnostic closure.
[target.'cfg(not(any(target_os = "android", all(target_os = "linux", not(target_os = "android")))))'.dependencies]
bevy = { workspace = true, features = [
    "bevy_ui",
    "bevy_feathers",
    "custom_cursor",
    "debug",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "png",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "system_font_discovery",
] }

[lints]
workspace = true
