[package]
name = "infiltrator-bevy-widgets"
version = "0.1.0"
edition = "2024"
publish = false
description = "Business-agnostic Bevy UI widget layer for MusicFrog: bsn! scene functions over the official unstyled bevy_ui_widgets."

# Business-agnostic by law (docs/BEVY_UI_FRONTEND.md): this crate depends on
# locked bevy only — never on infiltrator-core / mihomo-* / infiltrator-*. It
# is the future extraction candidate shared with taskmanager's bevy frontend,
# which is why bevy is pinned to the exact same patch (`=0.19.1`) so both
# workspaces resolve one widget ABI.

# Base `bevy` declaration with an EMPTY feature set. The per-target tables
# below own the real feature closure; this entry exists because bevy's derive
# macros (Event/Component/Resource) resolve `::bevy::…` paths by scanning this
# crate's plain `[dependencies]` table, and a target-table-only declaration
# leaves them unresolved. The feature union across the tables is exactly the
# per-target closure below. (Same two-phase shape taskmanager ships.)
[dependencies]
bevy = { version = "=0.19.1", default-features = false }
unicode-segmentation = "1.12"

# Feature closure (minimal for a bevy_ui surface), locked `=0.19.1`:
# - bevy_ui: the toolkit layer itself (its layout plugin; pulls bevy_text and
#   bevy_sprite; nothing 3D).
# - bevy_ui_widgets: the official unstyled widget package (button / checkbox /
#   radio / scrollarea / slider / text_input / menu / popover semantics).
#   Styling stays ours via theme tokens; Feathers is not adopted.
# - bevy_scene: the `bsn!` (Bevy Scene Notation) macro and the `Scene` /
#   `CommandsSceneExt` spawn seam. Charter law: static structure composes
#   declaratively with `bsn!`; no imperative `Node`/`Children` trees.
# - bevy_ui_render: bevy 0.19 splits ui layout from ui rendering, so
#   `bevy_ui` alone lays nodes out without ever painting them.
# - bevy_core_pipeline / bevy_render: the render-graph host the ui render
#   node plugs into.
# - bevy_asset: AssetPlugin, i.e. the Assets<Font>/Assets<Image> stores.
# - png: the only image codec this layer needs — the icon plates under
#   assets/icons/ are 64px RGBA PNGs, decoded by the asset-backed ImageLoader
#   the host's render stack registers.
# - bevy_winit: the window/event-loop host; no raw winit use of our own.
# - bevy_text: font shaping through cosmic-text, chosen explicitly.
# - ui_picking: the picking/message infrastructure the 0.19 widget observers
#   require (pointer release / IME queues).
# - wayland (Linux only): winit backend selection. The X11 sessions stay
#   carried by the iced frontend; revisit when bevy becomes the only surface.
# - default-features off: no audio, no gilrs, no 3D, no dynamic linking, no
#   dev-tools. `multi_threaded` stays off so headless tests can observe the
#   render pass inline on the app thread.
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "png",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "wayland",
    # system_font_discovery: parley/fontique system-font fallback. Without it
    # the font db holds only the embedded Latin faces and every zh-CN label
    # renders as tofu (observed in bevy capture round 1). In lockstep in
    # every bevy table of both bevy crates.
    "system_font_discovery",
] }

# Android (the reason this frontend exists), BEVY-006 front half: same UI
# closure as desktop, minus `wayland` (winit backend selection is a desktop
# compositor concern), plus `android-native-activity` — the one feature bevy
# 0.19.1 offers to satisfy android-activity's hard requirement
# (`android-activity` 0.6.1 compile_error!s unless exactly one of
# `native-activity`/`game-activity` is on; bevy_internal Cargo.toml.orig:152
# "Android activity support (choose one)", and native-activity is the simpler,
# more device-compatible entry point). There is deliberately no
# `android-shared-stdcxx`: bevy 0.19 removed it with the oboe audio stack
# (bevy-0.19.1/_release-content/migration-guides/rodio_0_22.md), and bevy's
# android windowing glue (`bevy_android`, `ANDROID_APP`) is wired in
# automatically by bevy_internal's `cfg(target_os = "android")` dep — no extra
# feature needed. `x11` stays off (bevy_winit default, not inherited:
# default-features = false above). A11y on Android has no bevy feature yet
# (0.19.1 only ships `accesskit_unix`), so TalkBack support is BEVY-M3 back
# half (APK packaging + on-device smoke) along with actually exercising this
# closure on hardware.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "png",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "android-native-activity",
    "system_font_discovery",
] }
# bevy_asset pulls blake3 (default-features = false) for asset hashing; on
# aarch64 blake3's build.rs unconditionally cc-compiles c/blake3_neon.c
# (blake3-1.8.7 build.rs: `!is_no_neon() && is_aarch64()`), which needs the
# NDK C compiler. This machine's cross-check environment (BEVY-006 front
# half) deliberately ships no NDK, so `no_neon` pins the portable Rust
# implementation — same BLAKE3 hash, slightly slower on device. Feature
# unification reaches bevy_asset's blake3; the other tables don't carry
# this, so desktop keeps NEON. BEVY-M3 back half: revisit (drop this pin
# once the APK build runs with a real NDK clang).
blake3 = { version = "1.8", default-features = false, features = ["no_neon"] }

# Everything that is neither the Linux desktop nor Android — today macOS and
# Windows — keeps the windowing-agnostic closure (no wayland, no android
# activity backend; winit picks its platform backend on its own).
[target.'cfg(not(any(target_os = "android", all(target_os = "linux", not(target_os = "android")))))'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_scene",
    "bevy_ui_render",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_asset",
    "png",
    "bevy_winit",
    "bevy_text",
    "ui_picking",
    "system_font_discovery",
] }

# Standalone workspace on purpose (empty `[workspace]` table): the root
# music-frog workspace must not absorb this crate — its bevy closure and lock
# stay independently resolvable so taskmanager's bevy frontend resolves the
# exact same widget ABI, and `aarch64-linux-android` cross-checks
# (BEVY-006) never drag the whole desktop workspace through bevy.
[workspace]
