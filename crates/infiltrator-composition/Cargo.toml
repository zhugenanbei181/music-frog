[package]
name = "infiltrator-composition"
version.workspace = true
edition = "2024"
publish = false
description = "Composition roots that wire concrete outbound and host adapters into the application layer."

[features]
capture-fixtures = ["dep:infiltrator-test-support"]

[dependencies]
lurker-core-ports = { path = "../lurker-core-ports" }
lurker-core-contract = { path = "../lurker-core-contract" }
lurker-engine-runtime = { version = "0.42.6", path = "../lurker-engine-runtime" }
async-trait = { workspace = true }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-domain = { path = "../infiltrator-domain" }
infiltrator-application = { path = "../infiltrator-application" }
infiltrator-ios = { path = "../infiltrator-ios" }
infiltrator-ports = { path = "../infiltrator-ports" }
infiltrator-presentation = { path = "../infiltrator-presentation" }
infiltrator-profile-store = { path = "../infiltrator-profile-store" }
lurker-profile-store = { path = "../lurker-profile-store" }
infiltrator-test-support = { path = "../infiltrator-test-support", optional = true }
log = { workspace = true }
mihomo-api = { path = "../mihomo-api" }
mihomo-driver = { version = "0.42.6", path = "../mihomo-driver" }
mihomo-config = { path = "../mihomo-config" }
singbox-api = { path = "../singbox-api" }
singbox-config = { path = "../singbox-config" }
singbox-driver = { path = "../singbox-driver" }
tokio = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
infiltrator-test-support = { path = "../infiltrator-test-support" }
serde_json = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
