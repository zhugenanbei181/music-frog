[package]
name = "infiltrator-core"
version.workspace = true
publish = false
edition = "2024"

[features]
# Opt-in live network probes. These tests are also `#[ignore]`, so the default
# `scripts/test.sh` suite stays fully offline and reports no skipped tests.
# Run them with (nextest is the repo's only supported runner):
#   cargo nextest run -p infiltrator-core --features network-tests \
#     --run-ignored ignored-only live_public
network-tests = []

[dependencies]
lurker-core-ports = { path = "../lurker-core-ports" }
lurker-core-contract = { path = "../lurker-core-contract" }
lurker-engine-runtime = { version = "0.68.0", path = "../lurker-engine-runtime" }
anyhow = { workspace = true }
async-trait = { workspace = true }
dav-client = { path = "../mihomo-dav-sync/dav-client" }
infiltrator-contract = { path = "../infiltrator-contract" }
brotli = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
log = { workspace = true }
infiltrator-domain = { path = "../infiltrator-domain" }
infiltrator-ports = { path = "../infiltrator-ports" }
mihomo-config = { path = "../mihomo-config" }
infiltrator-platform = { path = "../infiltrator-platform" }
infiltrator-profile-store = { path = "../infiltrator-profile-store" }
mihomo-api = { path = "../mihomo-api" }
mihomo-driver = { version = "0.68.0", path = "../mihomo-driver" }
mihomo-version = { path = "../mihomo-version" }
infiltrator-http = { path = "../infiltrator-http" }
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
state-store = { path = "../mihomo-dav-sync/state-store" }
sha2 = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
sync-engine = { path = "../mihomo-dav-sync/sync-engine" }
yaml-rust2 = { workspace = true }
regex = { workspace = true }
base64 = "0.22"
url = { workspace = true }
urlencoding = "2.1"
zip = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }
infiltrator-application = { path = "../infiltrator-application" }
singbox-api = { path = "../singbox-api" }
singbox-driver = { path = "../singbox-driver" }
infiltrator-composition = { path = "../infiltrator-composition" }
# Integration tests run the neutral adapter conformance kit.
lurker-engine-runtime = { path = "../lurker-engine-runtime", features = ["conformance"] }
