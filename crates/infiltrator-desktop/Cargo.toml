[package]
name = "infiltrator-desktop"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
infiltrator-composition = { path = "../infiltrator-composition" }
infiltrator-application = { path = "../infiltrator-application" }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-domain = { path = "../infiltrator-domain" }
infiltrator-core = { path = "../infiltrator-core" }
infiltrator-ports = { path = "../infiltrator-ports" }
infiltrator-profile-store = { path = "../infiltrator-profile-store" }
log = { workspace = true }
mihomo-api = { path = "../mihomo-api" }
mihomo-config = { path = "../mihomo-config" }
infiltrator-platform = { path = "../infiltrator-platform" }
mihomo-process = { path = "../mihomo-process" }
mihomo-version = { path = "../mihomo-version" }
singbox-api = { path = "../singbox-api" }
singbox-config = { path = "../singbox-config" }
singbox-process = { path = "../singbox-process" }
singbox-version = { path = "../singbox-version" }
reqwest = { workspace = true, default-features = false, features = ["json", "socks", "stream", "http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
yaml-rust2 = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
infiltrator-composition = { path = "../infiltrator-composition", features = ["capture-fixtures"] }
infiltrator-presentation = { path = "../infiltrator-presentation" }
infiltrator-test-support = { path = "../infiltrator-test-support" }
