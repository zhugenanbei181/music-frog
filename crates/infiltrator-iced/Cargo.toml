[package]
name = "infiltrator-iced"
version = "0.20.0"
edition = "2024"

# Lib + thin binary: `src/lib.rs` hosts the module tree and the application
# bootstrap (`infiltrator_iced::run`), `src/main.rs` is a one-call wrapper.
# The lib form lets the `tests/` integration harnesses see the crate; the
# binary target keeps its package name so `target/debug/infiltrator-iced`
# (used by scripts/capture-iced.sh) is unchanged.
[lib]
name = "infiltrator_iced"
path = "src/lib.rs"

[features]
# Force the muda/tray-icon backend everywhere (including Linux, where ksni is
# the default) so both tray backends stay compilable and checkable on this OS.
native-tray-backend = []

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced", "wgpu-bare", "canvas", "image", "svg", "x11", "wayland"] }
wgpu = { version = "27.0", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
# naga 27 enters this crate's graph via wgpu 27. When the bevy frontend
# (infiltrator-bevy-*) shares the workspace build graph, its naga_oil turns
# the shared `codespan-reporting/termcolor` feature ON, which breaks naga
# 27's no-termcolor diagnostic branches (E0277 `String: WriteColor`).
# Declaring naga 27 here (renamed; feature-only, nothing imported) unifies
# naga's own `termcolor` feature in, switching its DiagnosticBuffer to the
# `NoColor<Vec<u8>>` branch that implements codespan's WriteColor. Remove
# when iced's wgpu stack bumps past naga 27.
naga27 = { package = "naga", version = "27", default-features = false, features = ["termcolor"] }
tokio = { workspace = true }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-application = { path = "../infiltrator-application" }
infiltrator-ports = { path = "../infiltrator-ports" }
infiltrator-core = { path = "../infiltrator-core" }
infiltrator-desktop = { path = "../infiltrator-desktop" }
infiltrator-shared = { path = "../infiltrator-shared" }
infiltrator-admin = { path = "../infiltrator-admin" }
mihomo-version = { path = "../mihomo-version" }
mihomo-api = { path = "../mihomo-api" }
mihomo-config = { path = "../mihomo-config" }
mihomo-platform = { path = "../mihomo-platform" }
dav-client = { path = "../mihomo-dav-sync/dav-client" }
sync-engine = { path = "../mihomo-dav-sync/sync-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
# muda's optional libxdo is disabled at the workspace root (Linux accel. dep).
muda = { workspace = true }
tray-icon = { workspace = true }
ksni = { workspace = true }
is_elevated = "0.1"
anyhow = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
webbrowser = "1.0"
single-instance = "0.3"
sys-locale = "0.3"
image = "0.25"
rfd = "0.17"

# 0.20 OS system notifications: Linux/*BSD go through notify-rust's pure-Rust
# zbus ("z") backend, sharing the zbus 5 tree ksni already pulls in; the C
# libdbus ("d"/"d_vendored") backend is deliberately avoided. macOS/Windows and
# other targets use the log-only stub in src/notify.rs, so the dependency is
# target-gated and never enters their build graphs.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = { workspace = true }

# Test-only dependencies (business_flow journeys):
# - axum: minimal local WebDAV stub (127.0.0.1:0, zero external network) that
#   lets the real SyncUpload/SyncDownload workers run a full network leg
#   (tests/gui/business_flow/sync_conflicts.rs).
# - iced_runtime: `task::into_stream` unwraps an iced Task back into its
#   stream so journey tests drive the REAL worker chains end to end instead
#   of re-running task bodies by hand. Same 0.14 tree as the `iced` dep.
[dev-dependencies]
axum = { workspace = true }
iced_runtime = "0.14"

[package.metadata.packager]
product-name = "MusicFrog Infiltrator"
identifier = "com.musicfrog.infiltrator"
version = "0.20.0"
authors = ["MusicFrog"]
description = "A native high-performance proxy client."
icons = ["icons/icon.png"]
resources = [
    "icons/icon.png",
    "../../vendor/mihomo.exe"
]

[package.metadata.packager.wix]
languages = ["zh-CN"]
