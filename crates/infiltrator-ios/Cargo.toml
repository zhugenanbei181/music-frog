[package]
name = "infiltrator-ios"
version = "0.40.3"
edition = "2024"
publish = false
description = "iOS host adapter seams for NetworkExtension and Swift/Objective-C lifecycle bridges."

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
async-trait = { workspace = true }
infiltrator-application = { path = "../infiltrator-application" }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-ports = { path = "../infiltrator-ports" }

[dev-dependencies]
tokio = { workspace = true }
