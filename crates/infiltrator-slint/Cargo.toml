[package]
name = "infiltrator-slint"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
description = "Native Slint surface for MusicFrog Infiltrator"

[lib]
name = "infiltrator_slint"
path = "src/lib.rs"

[[bin]]
name = "infiltrator-slint"
path = "src/main.rs"
required-features = ["desktop-host"]

[features]
default = ["desktop-host"]
desktop-host = ["dep:infiltrator-application", "dep:infiltrator-desktop"]
capture-tools = [
    "desktop-host",
    "dep:infiltrator-composition",
    "infiltrator-composition/capture-fixtures",
    "dep:infiltrator-test-support",
]
static-openssl = ["dep:openssl", "openssl/vendored"]

[dependencies]
lurker-core-contract = { path = "../lurker-core-contract" }
lurker-ui-presentation = { version = "0.68.1", path = "../lurker-ui-presentation" }
anyhow.workspace = true
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-domain = { path = "../infiltrator-domain" }
infiltrator-presentation = { path = "../infiltrator-presentation" }
infiltrator-shared = { path = "../infiltrator-shared" }
infiltrator-application = { path = "../infiltrator-application", optional = true }
infiltrator-desktop = { path = "../infiltrator-desktop", optional = true }
infiltrator-composition = { path = "../infiltrator-composition", optional = true }
infiltrator-test-support = { path = "../infiltrator-test-support", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[build-dependencies]
slint-build.workspace = true

# EFFECTS-036 #146~#149（= SLINTUI-001 #1~#4）：桌面端 Skia GPU 主渲染器，
# femtovg 保留为轻量回退通道（`SLINT_BACKEND=winit-femtovg` 切换），软件
# 渲染仍是最后兜底；backend-qt 仅预留桥接位（树内无 Qt 依赖，不启用）。
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-skia", "renderer-femtovg"] }
rfd = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", optional = true }

[lints]
workspace = true
