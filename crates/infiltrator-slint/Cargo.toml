[package]
name = "infiltrator-slint"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
description = "Native Slint surface for Lumen"

[lib]
name = "infiltrator_slint"
path = "src/lib.rs"

[[bin]]
name = "infiltrator-slint"
path = "src/main.rs"
required-features = ["desktop-host"]

[features]
default = ["desktop-host"]
desktop-host = ["dep:infiltrator-application", "dep:infiltrator-desktop"]
capture-tools = [
    "desktop-host",
    "dep:infiltrator-composition",
    "infiltrator-composition/capture-fixtures",
    "dep:infiltrator-test-support",
]
gpu-skia = ["slint/renderer-skia"]
static-openssl = ["dep:openssl", "openssl/vendored"]

[dependencies]
lurker-core-contract = { path = "../lurker-core-contract" }
lurker-ui-presentation = { version = "0.68.2", path = "../lurker-ui-presentation" }
anyhow.workspace = true
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-domain = { path = "../infiltrator-domain" }
infiltrator-presentation = { path = "../infiltrator-presentation" }
infiltrator-shared = { path = "../infiltrator-shared" }
infiltrator-application = { path = "../infiltrator-application", optional = true }
infiltrator-desktop = { path = "../infiltrator-desktop", optional = true }
infiltrator-composition = { path = "../infiltrator-composition", optional = true }
infiltrator-test-support = { path = "../infiltrator-test-support", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[build-dependencies]
slint-build.workspace = true

# EFFECTS-036 #146~#149（= SLINTUI-001 #1~#4）：桌面 GPU 渲染通道。
# 离线网络隔离构建的默认通道是 winit+femtovg；renderer-skia 依赖构建期
# 拉取 Skia 预编译二进制，只能作为 opt-in 特性（`--features gpu-skia`）
# 提供给有网络的构建（23d76ce 的离线构建约束）。`SLINT_BACKEND` 环境变量
# 始终优先，软件渲染仍是最后兜底；backend-qt 仅预留桥接位（树内无 Qt）。
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }
rfd = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", optional = true }

[lints]
workspace = true
