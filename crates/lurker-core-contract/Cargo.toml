[package]
name = "lurker-core-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Engine-neutral proxy core contract: identity, lifecycle, outbound, routing intent and typed failure."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhugenanbei181/music-frog"

[package.metadata.docs.rs]
# docs.rs preview configuration (PUB-006.6).
# `all-features` covers every optional code path of the contract crate, and
# `--cfg docsrs` lets the crate expose documentation-only items later without
# changing the published API.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
url = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
