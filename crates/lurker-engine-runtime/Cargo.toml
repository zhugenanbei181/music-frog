[package]
name = "lurker-engine-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Engine-neutral backend registry, owner-switch coordinator and runtime facade for Lurker core hosts."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhugenanbei181/music-frog"

[package.metadata.docs.rs]
# docs.rs preview configuration (PUB-006.6).
# `all-features` is required here: the `conformance` kit is not a default
# feature, so only `all-features` publishes the complete public API.
# `--cfg docsrs` lets the crate expose documentation-only items later without
# changing the published API.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
# Neutral adapter and owner-switch conformance kit. Opt-in: product hosts do
# not compile the kit unless they explicitly run conformance.
conformance = []

[dependencies]
lurker-core-contract = { version = "0.68.2", path = "../lurker-core-contract" }
lurker-core-ports = { version = "0.68.2", path = "../lurker-core-ports" }
async-trait = { workspace = true }
# Executor-neutral state fan-out and readiness deadline. No tokio dependency:
# the facade must run on every host runtime.
futures-channel = "0.3"
futures-core = "0.3"
futures-timer = "3.0"

[dev-dependencies]
futures-executor = "0.3"

[[test]]
name = "third_party_adapter"
required-features = ["conformance"]

[lints]
workspace = true
