[package]
name = "lurker-ui-presentation"
version.workspace = true
edition = "2024"
description = "Engine-, platform- and UI-neutral presentation kernel: typed reducers, viewport policy and text-catalog port."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhugenanbei181/music-frog"

[package.metadata.docs.rs]
# docs.rs preview configuration (PUB-006.6).
# `all-features` covers every optional code path of the presentation crate,
# and `--cfg docsrs` lets the crate expose documentation-only items later
# without changing the published API.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
lurker-core-contract = { version = "0.51.0", path = "../lurker-core-contract" }

[dev-dependencies]
serde_json = { workspace = true }
