[package]
name = "mihomo-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "socks", "stream", "http2"] }
log = { workspace = true }
futures-util = { workspace = true }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-ports = { path = "../infiltrator-ports" }
yaml-rust2 = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["rustls-no-provider"] }
# mihomo-api only uses plaintext (ws://) websockets on Android; connect_async /
# accept_async need no TLS backend. The workspace tokio-tungstenite enables
# native-tls, which would drag OpenSSL into the Android NDK build, so Android
# uses a TLS-free declaration instead.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["native-tls"] }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tokio = { workspace = true }
