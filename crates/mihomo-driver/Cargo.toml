[package]
name = "mihomo-driver"
version.workspace = true
edition = "2024"
description = "Engine driver for the mihomo (Clash.Meta) core: control API, configuration codec and process supervision."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhugenanbei181/music-frog"

[package.metadata.docs.rs]
# docs.rs preview configuration (PUB-006.6).
# `all-features` is required here: the `http`, `process`, `codec` and
# `backend` feature slices each hide a public module, so only `all-features`
# publishes the complete public API of the driver. The crate owns per-OS
# process code, so both the Linux and the Windows branch are published.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[features]
# HTTP-only builds may omit process supervision entirely (for example the
# Android host, which owns its own VPN service process).
default = ["http", "process", "codec", "backend"]
# Ready-made `EngineBackendProvider<EngineBackendPorts>` assembly.
backend = ["http", "process", "codec"]
http = ["dep:tokio-tungstenite"]
process = ["dep:sysinfo", "dep:libc", "dep:windows-sys"]
# Native YAML codec plus the native `-t` dry-run hook. The hook drives the
# process command boundary, so the codec always enables process supervision.
codec = ["process"]

[dependencies]
lurker-core-contract = { version = "0.68.0", path = "../lurker-core-contract" }
lurker-core-ports = { version = "0.68.0", path = "../lurker-core-ports" }
async-trait = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
yaml-rust2 = { workspace = true }
reqwest = { workspace = true, default-features = false, features = [
  "json",
  "socks",
  "stream",
  "http2",
] }
sysinfo = { workspace = true, optional = true }
# The controller WebSocket is loopback plaintext `ws://` only, so the workspace
# `tokio-tungstenite` default (native-tls) is overridden to link no TLS backend.
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = [
  "connect",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
