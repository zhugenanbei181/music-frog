[package]
name = "mihomo-process"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
infiltrator-contract = { path = "../infiltrator-contract" }
infiltrator-platform = { path = "../infiltrator-platform" }
infiltrator-ports = { path = "../infiltrator-ports" }
log = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = { workspace = true }
