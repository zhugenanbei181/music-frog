[package]
name = "mihomo-version"
version = "0.1.2"
edition = "2024"
publish = false

[dependencies]
lurker-core-contract = { path = "../lurker-core-contract" }
anyhow = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
log = { workspace = true }
mihomo-driver = { version = "0.68.0", path = "../mihomo-driver", default-features = false }
infiltrator-platform = { path = "../infiltrator-platform" }
reqwest = { workspace = true, default-features = false, features = ["json", "socks", "stream", "http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
zip = { workspace = true }
futures-util = { workspace = true }
toml = { workspace = true }
infiltrator-contract = { path = "../infiltrator-contract" }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["rustls-no-provider"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["native-tls"] }

[dev-dependencies]
mockito = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
