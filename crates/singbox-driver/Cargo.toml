[package]
name = "singbox-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Engine driver for the sing-box core: control API, configuration codec and process supervision."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhugenanbei181/music-frog"

[package.metadata.docs.rs]
# docs.rs preview configuration (PUB-006.6).
# `all-features` is required here: the `http`, `process`, `codec` and
# `backend` feature slices each hide a public module, so only `all-features`
# publishes the complete public API of the driver. The crate owns per-OS
# process code, so both the Linux and the Windows branch are published.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[features]
default = ["http", "process", "codec", "backend"]
# Ready-made `EngineBackendProvider<EngineBackendPorts>` assembly.
backend = ["http", "process", "codec"]
# Clash API transport, controller preflight, readiness, routing intent and
# outbound inventory/selection.
http = ["dep:reqwest", "dep:url", "dep:serde", "dep:serde_json"]
# Native process supervision: spawn, stop, child polling and pid readback.
process = []
# Native JSON codec plus the native `check` transaction hook. The codec drives
# the `process` command boundary, so it always enables process supervision.
codec = ["process", "dep:serde_json"]

[dependencies]
lurker-core-contract = { version = "0.68.1", path = "../lurker-core-contract" }
lurker-core-ports = { version = "0.68.1", path = "../lurker-core-ports" }
async-trait = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
reqwest = { workspace = true, default-features = false, optional = true }
tokio = { workspace = true }
url = { workspace = true, optional = true }

# The controller is a loopback plaintext http admin API, so no TLS backend is
# linked: this keeps OpenSSL out of Linux and NDK builds and lets the driver
# cross-compile without a target OpenSSL toolchain.

[dev-dependencies]
tempfile = { workspace = true }
# The paused clock lets the probe's own deadline be proven without waiting for
# it, so the timeout behaviour is covered by an ordinary hermetic test.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
