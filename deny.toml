# Dependency policy of the workspace, enforced by `cargo deny check`.
#
# Two surfaces, one truth each:
#   * `THIRD-PARTY-NOTICES.md` discloses what ships and under which license;
#   * this file is the machine-enforced allow list for the cargo graph.
# `scripts/quality/dependency-policy-guard.py` keeps the two consistent and
# verifies that CI actually runs the checks. Never widen a list here to make a
# build pass: a new license is a disclosure decision first.

[graph]
all-features = true

[advisories]
# The advisory database is fetched from the default RustSec source. Ignoring an
# advisory requires an entry with a written reason; the guard only checks that
# the section exists, cargo-deny owns the matching itself.
ignore = []

[licenses]
# Permissive licenses only. The list mirrors the licenses the committed lock
# file actually contains, so `cargo deny check licenses` is a real gate and not
# a guess. Copyleft and `LicenseRef` crates are never allowed globally: they
# are allowed one crate at a time below, with the reason in a comment and the
# disclosure in `THIRD-PARTY-NOTICES.md`.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

# The Slint surface is distributed under the royalty-free variant of the
# upstream dual license. Upstream offers `GPL-3.0-only`,
# `LicenseRef-Slint-Royalty-free-2.0` and `LicenseRef-Slint-Software-3.0`; the
# product relies on the royalty-free variant and never on the commercial one.
# Each crate is listed separately on purpose: a blanket entry would also allow
# the commercial variant.
[[licenses.exceptions]]
crate = "i-slint-backend-android-activity@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-linuxkms@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-selector@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-testing@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-winit@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-common@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-compiler@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core-macros@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-skia@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-software@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint-build@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint-macros@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

# The Android host tunnels through `tun2proxy`, whose SOCKS5 implementation is
# GPL-3.0-or-later. This is the one copyleft crate that ships inside the APK.
# The distribution model is adjudicated (ENG-003.1): every release build
# carries the license text and the source-offer notice in
# `android/app/src/main/assets/third-party/`, disclosed in
# `THIRD-PARTY-NOTICES.md` §13; replacing the SOCKS5 client leg is the tracked
# long-term exit that would delete this exception.
[[licenses.exceptions]]
crate = "socks5-impl@0.5.17"
allow = ["GPL-3.0-or-later"]

[licenses.private]
# Workspace crates that are not published (`publish = false`) are internal
# implementation, not redistributed crates; their manifests need no license
# field. Published crates still carry `MIT OR Apache-2.0`.
ignore = true

[bans]
# A duplicate major version is a warning to review, never a silent fact.
multiple-versions = "warn"
# `version = "*"` makes a build unreproducible; the lock file is the pin.
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Every crate comes from crates.io. Git and alternative registries are denied
# so a fork cannot enter the build without an explicit policy change here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
