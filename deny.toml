[[licenses.exceptions]]
crate = "slint-macros@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint@1.18.1"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

# The Android host tunnels through `tun2proxy`, whose SOCKS5 implementation is
# GPL-3.0-or-later. This is the one copyleft crate that ships inside the APK.
# The distribution model is adjudicated (ENG-003.1): every release build
# carries the license text and the source-offer notice in
# `android/app/src/main/assets/third-party/`, disclosed in
# `THIRD-PARTY-NOTICES.md` §13; replacing the SOCKS5 client leg is the tracked
# long-term exit that would delete this exception.
[[licenses.exceptions]]
crate = "socks5-impl@0.10.3"
allow = ["GPL-3.0-or-later"]

[licenses.private]
# Workspace crates that are not published (`publish = false`) are internal
# implementation, not redistributed crates; their manifests need no license
# field. Published crates still carry `MIT OR Apache-2.0`.
ignore = true

[bans]
# A duplicate major version is a warning to review, never a silent fact.
multiple-versions = "warn"
# `version = "*"` makes a build unreproducible; the lock file is the pin.
# Workspace path dependencies are private (`publish = false`); Cargo treats
# their omitted versions as wildcards. Keep registry and git wildcards denied.
allow-wildcard-paths = true
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Every crate comes from crates.io. Git and alternative registries are denied
# so a fork cannot enter the build without an explicit policy change here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
