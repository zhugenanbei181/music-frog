[package]
name = "lurker-example-minimal-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Minimal Lurker Iced example: a neutral lifecycle rendered by an Iced surface."
license = "MIT OR Apache-2.0"

# The gallery example may only use the published neutral Lurker crates plus the
# one UI toolkit it demonstrates. The Iced feature set is identical to the
# one the Slint/Iced/Bevy product templates use, so the workspace lock file
# stays the single source of truth for the dependency graph.
[dependencies]
lurker-core-contract = { path = "../../crates/lurker-core-contract" }
lurker-ui-presentation = { path = "../../crates/lurker-ui-presentation" }
iced = { version = "0.14", default-features = false, features = ["tokio", "wgpu-bare", "wayland", "x11"] }

[[example]]
name = "minimal-iced"
path = "main.rs"

[lints]
workspace = true
