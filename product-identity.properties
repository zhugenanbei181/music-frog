# Single source of truth for separately installable products across surfaces.
# Version codes are derived by scripts/product_identity.py:
# Compose uses a decimal composite; Bevy and Slint use packed product slots plus
# 8-bit SemVer components. Register every separately installable app below
# with its source icon asset; guards discover Android apps and reject drift.
# Release version comes only from [workspace.package].version in Cargo.toml.
android.products=compose,bevy,slint
desktop.products=iced,bevy,slint
android.namespace=com.musicfrog.infiltrator
# Independent support crates keep their own lifecycle and are not app-release versions.
rust.version_exemptions=infiltrator-http,infiltrator-shared
# Explicit non-product command tools; a new executable must be registered as a product or classified here.
rust.non_product_binaries=infiltrator,uniffi-bindgen
# Product icon variant matrix derived from the canonical icon.png below.
product.icon_variant_px=16,24,32,48,256
product.android_icon_density=mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192

desktop.iced.display_name=MusicFrog Infiltrator
desktop.iced.binary_name=infiltrator-iced
desktop.iced.bundle_id=com.musicfrog.infiltrator
desktop.iced.icon_png=crates/infiltrator-shared/assets/product/icon.png
desktop.iced.icon_ico=crates/infiltrator-shared/assets/product/icon.ico
desktop.iced.release_artifact_prefix=Infiltrator
desktop.iced.release_matrix_key=artifact_name
desktop.iced.linux_package_id=infiltrator
desktop.iced.linux_desktop_file=packaging/linux/appimage/infiltrator.desktop
desktop.iced.linux_comment=Mihomo and sing-box proxy client (Iced desktop surface)
desktop.iced.url_scheme=infiltrator
desktop.iced.macos_app_dir=MusicFrog Infiltrator.app
desktop.iced.macos_icon_filename=icon.icns
desktop.iced.windows_nsis_script=packaging/windows/nsis/infiltrator.nsi
desktop.iced.windows_installer_prefix=Infiltrator-Setup

desktop.bevy.display_name=MusicFrog Infiltrator Bevy
desktop.bevy.binary_name=infiltrator-bevy-ui
desktop.bevy.bundle_id=com.musicfrog.infiltrator.bevy
desktop.bevy.icon_png=crates/infiltrator-shared/assets/product/icon.png
desktop.bevy.icon_ico=crates/infiltrator-shared/assets/product/icon.ico
desktop.bevy.release_artifact_prefix=Infiltrator-Bevy
desktop.bevy.release_matrix_key=bevy_artifact_name
desktop.bevy.linux_package_id=infiltrator-bevy
desktop.bevy.linux_desktop_file=packaging/linux/appimage/infiltrator-bevy.desktop
desktop.bevy.linux_comment=Mihomo and sing-box proxy client (Bevy desktop surface)
desktop.bevy.url_scheme=infiltrator-bevy
desktop.bevy.macos_app_dir=MusicFrog Infiltrator Bevy.app
desktop.bevy.macos_icon_filename=icon.icns
desktop.bevy.windows_nsis_script=packaging/windows/nsis/infiltrator-bevy.nsi
desktop.bevy.windows_installer_prefix=Infiltrator-Bevy-Setup

desktop.slint.display_name=MusicFrog Infiltrator Slint
desktop.slint.binary_name=infiltrator-slint
desktop.slint.bundle_id=com.musicfrog.infiltrator.slint
desktop.slint.icon_png=crates/infiltrator-shared/assets/product/icon.png
desktop.slint.icon_ico=crates/infiltrator-shared/assets/product/icon.ico
desktop.slint.release_artifact_prefix=Infiltrator-Slint
desktop.slint.release_matrix_key=slint_artifact_name
desktop.slint.linux_package_id=infiltrator-slint
desktop.slint.linux_desktop_file=packaging/linux/appimage/infiltrator-slint.desktop
desktop.slint.linux_comment=Mihomo and sing-box proxy client (Slint desktop surface)
desktop.slint.url_scheme=infiltrator-slint
desktop.slint.macos_app_dir=MusicFrog Infiltrator Slint.app
desktop.slint.macos_icon_filename=icon.icns
desktop.slint.windows_nsis_script=packaging/windows/nsis/infiltrator-slint.nsi
desktop.slint.windows_installer_prefix=Infiltrator-Slint-Setup

compose.application_id=com.musicfrog.infiltrator
compose.display_name=MusicFrog Infiltrator
compose.icon_resource=ic_app_icon
compose.icon_asset=crates/infiltrator-shared/assets/product/icon.png
