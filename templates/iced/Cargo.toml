[package]
name = "lurker-template-iced"
version = "0.1.0"
edition = "2024"
publish = false
description = "Responsive Elm-architecture desktop proxy client template built on Iced."
license = "MIT OR Apache-2.0"

[dependencies]
lurker-core-contract = { path = "../../crates/lurker-core-contract" }
lurker-core-ports = { path = "../../crates/lurker-core-ports" }
infiltrator-contract = { path = "../../crates/infiltrator-contract" }
infiltrator-ports = { path = "../../crates/infiltrator-ports" }
iced = { version = "0.14", default-features = false, features = ["tokio", "wgpu-bare", "wayland", "x11"] }
tokio = { workspace = true, features = ["full"] }
